<style>
/* Layout: mundo 3D em tela cheia; HUD discreto no topo, diálogo em cartão branco embaixo, telas de capítulo em azul Midiando. */
:root{
  --blue:#2F4BFF; --blue-2:#3D58FF; --lime:#E6FF3B; --orange:#FF5A1F; --green:#BFFF8A; --pink:#FF7AD9; --lilac:#E8CCFF;
  --ink:#111216; --ink-2:#5A5D6B; --line:#DCDEE6; --paper:#FFFFFF; --soft:#F2F3F7; --sky:#CFE6FF;
  --f-display:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
.lime{background:var(--lime);color:var(--ink);padding:0 .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{font-size:12.5px;color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border-radius:999px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--ink);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.blue{background:var(--blue)}
.btn.limeb{background:var(--lime);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px currentColor}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* HUD */
.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.obj{background:rgba(255,255,255,.95);border-radius:12px;padding:9px 12px 10px;max-width:min(72vw,380px);box-shadow:0 4px 18px rgba(17,18,22,.12)}
.obj .cap{font-family:var(--f-display);font-size:13px;letter-spacing:.07em;color:var(--blue);text-transform:uppercase}
.obj .txt{font-weight:700;font-size:15px;line-height:1.25;margin-top:1px}
.voz{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.voz b{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.voz i{display:block;height:100%;width:0;background:var(--blue);transition:width .8s ease}
.tools{display:flex;gap:6px;pointer-events:auto}
.icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 18px rgba(17,18,22,.12)}
.icon svg{width:20px;height:20px}
.toast{position:fixed;z-index:9;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap;animation:tin .25s ease-out}
.toast b{color:var(--lime)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.hint{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px}

/* joystick */
#joy{position:fixed;z-index:5;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(17,18,22,.2)}

/* diálogo */
.dlg{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:#fff;border-radius:16px;padding:20px 18px 14px;box-shadow:0 12px 40px rgba(17,18,22,.28);cursor:pointer;animation:din .2s ease-out}
@keyframes din{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.dlg .name{position:absolute;top:-13px;left:16px;background:var(--lime);font-family:var(--f-display);letter-spacing:.05em;font-size:16px;padding:2px 10px;text-transform:uppercase}
.dlg .text{font-size:17px;line-height:1.45;min-height:2.9em}
.dlg .text.narr{color:var(--ink-2);font-style:italic}
.dlg .more{display:block;text-align:right;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.choices{display:flex;flex-direction:column;gap:7px;margin-top:12px;cursor:default}
.choice{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:16px;line-height:1.3;transition:background .15s}
.choice:hover,.choice:focus-visible{background:var(--lime)}
.choice .n{font-family:var(--f-display);color:var(--blue);font-size:17px;flex:none}

/* sobreposições */
.ovl{position:fixed;inset:0;z-index:10;display:flex;justify-content:center}
.ovl.title{align-items:flex-end;background:linear-gradient(to top,rgba(17,18,22,.9) 0%,rgba(17,18,22,.72) 42%,rgba(17,18,22,0) 78%)}
.titlebox{width:min(560px,100%);padding:24px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));color:#fff;display:flex;flex-direction:column;gap:16px}
.titlebox .kick{font-family:var(--f-display);letter-spacing:.12em;font-size:15px;color:var(--lime)}
.titlebox h1{font-size:clamp(64px,19vw,104px);line-height:.98}
.titlebox h1 .lime{display:inline-block;line-height:1.02;padding:0 .12em;margin-top:.06em}
.titlebox p{font-size:16.5px;max-width:38ch;opacity:.92}
.titlebox .note{color:#fff;opacity:.75}
.ovl.sheet{align-items:flex-end;pointer-events:none}
.sheetbox{pointer-events:auto;width:min(560px,100%);max-height:58%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(17,18,22,.2);user-select:auto}
.sheetbox h2{font-size:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.opt .lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.field input{border:0;border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;background:var(--soft)}
.opt{display:flex;flex-direction:column;gap:7px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(17,18,22,.15)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.tx{display:flex;flex-wrap:wrap;gap:6px}
.tx button{padding:7px 12px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px}
.tx button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ovl.center{align-items:center;background:rgba(17,18,22,.5);padding:16px}
.card{width:min(460px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:18px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;animation:din2 .25s ease-out;user-select:auto}
@keyframes din2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.card h2{font-size:34px}
.card p{font-size:16px;line-height:1.5}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.list li:first-child{border-top:0}
.list b{font-weight:700}
.ovl.chapter{align-items:center;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--blue) 0 9deg,var(--blue-2) 9deg 18deg);color:#fff;cursor:pointer;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.chap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.chap .n{background:var(--lime);color:var(--ink);font-family:var(--f-display);font-size:20px;letter-spacing:.08em;padding:2px 12px}
.chap h1{font-size:clamp(48px,14vw,92px);max-width:12ch}
.flash{position:fixed;inset:0;background:#fff;z-index:12;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* urna */
.urna{background:#d9d4c7;border-radius:14px;padding:12px;display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.tela{background:#f7f7f2;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:190px;font-size:13px}
.tela .cargo{font-weight:800;font-size:16px;letter-spacing:.04em}
.digs{display:flex;gap:4px}
.digs span{width:24px;height:30px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;background:#fff;font-variant-numeric:tabular-nums}
.tela .inst{margin-top:auto;border-top:1px solid var(--ink);padding-top:6px;font-size:11px;line-height:1.3}
.teclado{background:#2a2a30;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.teclado button{background:#111;color:#fff;border-radius:5px;padding:8px 0;font-weight:800;font-size:16px}
.teclado .z{grid-column:2}
.acoes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acoes button{border-radius:6px;padding:10px 2px;font-weight:800;font-size:12.5px;letter-spacing:.03em}
.acoes .branco{background:#fff}.acoes .corrige{background:#F58B2C}.acoes .confirma{background:#2BB24C;color:#fff}

/* final */
.ovl.final{background:var(--soft);overflow:auto;display:block;user-select:auto}
.fin{width:min(480px,100%);margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.fin img{width:100%;height:auto;border-radius:16px;display:block;box-shadow:0 10px 30px rgba(17,18,22,.18);-webkit-touch-callout:default}
.fin .panel{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.fin h2{font-size:28px}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.recap li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.recap li:first-child{border-top:0}
.recap .c{font-family:var(--f-display);color:var(--blue);flex:none;width:20px}
.aula{background:var(--lime);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;letter-spacing:.06em;color:var(--blue);z-index:20;background:var(--sky)}
</style>

<canvas id="c" aria-label="Mundo do jogo Antes do Título"></canvas>
<div class="loading" id="loading">CARREGANDO O BAIRRO…</div>
<div class="hud" id="hud" hidden>
  <div class="obj"><div class="cap" id="hCap"></div><div class="txt" id="hObj"></div><div class="voz">Voz <b><i id="hVoz"></i></b></div></div>

</div>
<div id="joy" hidden><div id="knob"></div></div>

<div class="dlg" id="dlg" hidden><span class="name" id="dName"></span><p class="text" id="dText"></p><div class="choices" id="dCh"></div><span class="more" id="dMore">Toque para continuar ▸</span></div>
<div id="ovl"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

];

  {from:'Justiça Eleitoral · perfil oficial', txt:'Pode levar "colinha"! O eleitor pode anotar os números dos candidatos num papel e levar para a cabine.', v:true,

];

const AU = {ctx:null, on:true};
const midi = m => 440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
  const c = AU.ctx = new C();
  AU.master = c.createGain(); AU.master.gain.value = AU.on ? .9 : 0; AU.master.connect(c.destination);
  AU.sfx = c.createGain(); AU.sfx.gain.value = .55; AU.sfx.connect(AU.master);
  AU.mus = c.createGain(); AU.mus.gain.value = .2; AU.mus.connect(AU.master);
  const len = c.sampleRate*.25, b = c.createBuffer(1,len,c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  AU.noise = b;
  startMusic();
}
function tone(f, t0, dur, type='square', vol=.2, dest=AU.sfx, slide=0){
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t0+dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+.012); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0, dur, freq, vol){
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  s.connect(f); f.connect(g); g.connect(AU.sfx); s.start(t0); s.stop(t0+dur);
}
const now = () => AU.ctx.currentTime;
const SFX = {
  click(){ if(!AU.ctx) return; tone(900, now(), .05, 'triangle', .12); },
  talk(base){ if(!AU.ctx) return; tone(base*(.9+Math.random()*.25), now(), .05, 'square', .035); },
  step(){ if(!AU.ctx) return; noise(now(), .07, 260+Math.random()*120, .18); },
  pick(){ if(!AU.ctx) return; const t=now(); [72,76,79,84].forEach((m,i)=>tone(midi(m), t+i*.07, .18, 'triangle', .16)); },
  ok(){ if(!AU.ctx) return; const t=now(); tone(midi(76),t,.12,'square',.08); tone(midi(83),t+.1,.25,'square',.08); },
  no(){ if(!AU.ctx) return; tone(200, now(), .3, 'sawtooth', .06, AU.sfx, .55); },
  chapter(){ if(!AU.ctx) return; const t=now(); [60,64,67,72].forEach((m,i)=>tone(midi(m), t+i*.09, 1.4, 'triangle', .09)); tone(midi(48), t, 1.6, 'sine', .2); },
  win(){ if(!AU.ctx) return; const t=now(); [67,72,76,79,84].forEach((m,i)=>tone(midi(m), t+i*.1, .35, 'square', .06)); },
  shutter(){ if(!AU.ctx) return; const t=now(); noise(t,.05,3000,.4); noise(t+.07,.08,1800,.3); },
  key(){ if(!AU.ctx) return; tone(1250, now(), .06, 'square', .08); },
  urnaFim(){ if(!AU.ctx) return; const t=now(); for(let i=0;i<5;i++) tone(1050, t+i*.11, i===4?.5:.07, 'square', .08); },
  vibra(){ if(!AU.ctx) return; const t=now(); tone(120,t,.15,'sawtooth',.06); tone(120,t+.2,.15,'sawtooth',.06); }
};
const PROG = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]];
function startMusic(){
  let step = 0, nt = AU.ctx.currentTime + .15; const e8 = 60/98/2;
  setInterval(()=>{
    if(!AU.ctx || AU.ctx.state!=='running') return;
    while(nt < AU.ctx.currentTime + .3){
      const bar = Math.floor(step/8)%4, e = step%8, ch = PROG[bar], arp = [0,2,1,3,2,1,3,2];
      tone(midi(ch[arp[e]]+12), nt, .26, 'triangle', .07, AU.mus);
      if(e===0||e===4) tone(midi(ch[0]-12), nt, .45, 'sine', .22, AU.mus);
      if(e===0) ch.forEach(m=>tone(midi(m), nt, e8*8, 'sine', .028, AU.mus));
      if(e===2||e===6) noise(nt, .04, 7000, .05);
      nt += e8; step++;
    }
  }, 60);
}
function setSound(on){

function building(o){

  box(o.w+.6, .5, o.d+.6, o.roof, 0, o.h+.25, 0, g);
  box(1.8, 2.6, .2, o.door||'#2B2D38', 0, 1.3, o.d/2+.05, g);
  const nWin = Math.max(1, Math.floor((o.w-3)/3.2));
  for(let i=0;i<nWin;i++){
    const xx = -o.w/2 + 1.6 + i*((o.w-3.2)/Math.max(1,nWin-1||1));
    if(Math.abs(xx) < 1.6) continue;
    box(1.3, 1.1, .12, '#DDEBFF', xx, o.h*.62, o.d/2+.06, g);

  const sideways = o.face==='+x' || o.face==='-x';
  obstacle(o.x, o.z, (sideways?o.d:o.w)+(o.cols?0:0), (sideways?o.w:o.d)+(o.cols?2.6:0));
  const out = new THREE.Vector3(0, 0, o.d/2 + (o.cols?3.2:1.8)).applyAxisAngle(V3(0,1,0), g.rotation.y);

}

  const limb = (x, y, len, r, color, parent) => { const p = new THREE.Group(); p.position.set(x,y,0); parent.add(p); mesh(cap(r,len), color, 0, -len/2-r*.4, 0, p); return p; };
  u.armL = limb(-.52, 1.5, .5, .12, skin, g);
  u.armR = limb(.52, 1.5, .5, .12, skin, g);
  [u.armL,u.armR].forEach(a=>{ const s = mesh(new THREE.SphereGeometry(.17,10,8), o.camisa, 0, -.04, 0, a); s.scale.y=.9; });
  u.legL = limb(-.2, .82, .45, .15, o.calca, g);
  u.legR = limb(.2, .82, .45, .15, o.calca, g);
  [u.legL,u.legR].forEach(l=>box(.28,.16,.42,'#F4F5F0',0,-.76,.06,l));
  u.phase = 0;
  return g;
}
function animChar(ch, moving, dt){
  const u = ch.userData;
  u.phase += dt * (moving ? 11 : 2.2);
  const s = moving ? Math.sin(u.phase) * .75 : 0;
  u.legL.rotation.x = s; u.legR.rotation.x = -s;
  u.armL.rotation.x = -s*.8; u.armR.rotation.x = s*.8;
  ch.children[0].position.y = 1.22 + (moving ? Math.abs(Math.cos(u.phase))*.06 : Math.sin(u.phase)*.02);
}

const ui = {lock:0, keyFn:null};
const dlg = $('#dlg'), dName = $('#dName'), dText = $('#dText'), dCh = $('#dCh'), dMore = $('#dMore');
let hideTimer = null;
function openDlg(){ ui.lock++; clearTimeout(hideTimer); dlg.hidden = false; }

function say(name, text){
  return new Promise(res=>{
    openDlg(); dlg.dataset.busy = '1';
    dName.hidden = !name; dName.textContent = name || '';
    dText.className = 'text' + (name ? '' : ' narr');
    dCh.innerHTML = ''; dMore.hidden = true;
    const base = VOICE[name] || (name===N() ? 330 : 0);
    let i = 0, done = false;
    const iv = setInterval(()=>{
      i += 2; dText.textContent = text.slice(0,i);
      if(base && i%4===0) SFX.talk(base);
      if(i >= text.length){ clearInterval(iv); done = true; dMore.hidden = false; }
    }, 24);
    const adv = () => {
      if(!done){ clearInterval(iv); dText.textContent = text; done = true; dMore.hidden = false; return; }
      dlg.onclick = null; ui.keyFn = null; delete dlg.dataset.busy; SFX.click(); closeDlg(); res();
    };
    dlg.onclick = adv;
    ui.keyFn = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); adv(); } };
  });
}
function choose(opts, name, prompt){
  return new Promise(res=>{
    openDlg(); dlg.dataset.busy = '1'; dlg.onclick = null;
    dName.hidden = !name; dName.textContent = name || '';
    dText.className = 'text' + (name ? '' : ' narr');
    dText.textContent = prompt || '';
    dMore.hidden = true;
    dCh.innerHTML = opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="n">${k+1}</span><span>${esc(o)}</span></button>`).join('');
    const pick = k => { dCh.innerHTML = ''; ui.keyFn = null; delete dlg.dataset.busy; SFX.ok(); closeDlg(); res(k); };
    dCh.querySelectorAll('.choice').forEach(b=>b.onclick = ev => { ev.stopPropagation(); pick(+b.dataset.k); });
    ui.keyFn = e => { const k = parseInt(e.key,10)-1; if(k>=0 && k<opts.length) pick(k); };
    setTimeout(()=>dCh.querySelector('.choice')?.focus({preventScroll:true}), 50);
  });
}
const ovl = $('#ovl');
function overlay(cls, html){ ovl.innerHTML = `<div class="ovl ${cls}">${html}</div>`; return ovl.firstElementChild; }
function info(kicker, title, body, btn='Continuar'){
  return new Promise(res=>{
    ui.lock++;
    const o = overlay('center', `<div class="card" role="dialog" aria-modal="true"><span class="k">${kicker}</span><h2>${title}</h2>${body}<button class="btn" id="okb">${btn}</button></div>`);
    const b = o.querySelector('#okb'); b.focus({preventScroll:true});
    b.onclick = () => { SFX.click(); ovl.innerHTML=''; ui.lock--; ui.keyFn=null; res(); };
    ui.keyFn = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); } };
  });
}
function chapter(n, title){
  return new Promise(res=>{
    ui.lock++; SFX.chapter();
    const o = overlay('chapter', `<div class="chap"><span class="n">${n ? 'CAPÍTULO '+n : 'DOMINGO'}</span><h1>${title}</h1></div>`);
    let gone = false;
    const end = () => { if(gone) return; gone = true; ovl.innerHTML=''; ui.lock--; ui.keyFn=null; res(); };
    o.onclick = end; ui.keyFn = e => { if(e.key===' '||e.key==='Enter') end(); };
    setTimeout(end, 2600);
  });
}
function toast(html){ const t = document.createElement('div'); t.className='toast'; t.innerHTML = html; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }

/* ---------- objetivos ---------- */
let quest = null;
function goTo(obj, targets){
  return new Promise(res=>{
    quest = {obj, res, targets: targets.map(t=>({...t, pos: t.pos || (t.npc ? npcPos(t.npc) : PLACES[t.at]), done:false}))};
    quest.targets.forEach(t => t.marker = makeMarker(t.pos, t.prop));
    updateObj();
  });
}
function updateObj(){
  if(!quest){ $('#hObj').textContent = ''; return; }
  const n = quest.targets.length, d = quest.targets.filter(t=>t.done).length;
  $('#hObj').textContent = n > 1 ? `${quest.obj} (${d}/${n})` : quest.obj;
}
async function arrive(t){
  ui.lock++;
  scene.remove(t.marker);
  if(t.npc) lookAtPlayer(t.npc);
  ui.lock--;
  if(t.run) await t.run();
  t.done = true; updateObj();
  if(quest && quest.targets.every(x=>x.done)){ const r = quest.res; quest = null; updateObj(); r(); }
}

  await goTo('Cheque as mensagens suspeitas', MSGS.map((m,i)=>({pos:spots[i], r:2.3, prop:'fone', run: async()=>{
    SFX.vibra();
    await say(m.from, m.txt);
    const c = await choose(['É verdade','É boato ou golpe'], m.from);
    const ok = (c===0) === m.v; st.checks++; if(ok) st.acertos++;
    ok ? SFX.ok() : SFX.no();
    await say(null, (ok ? 'Boa! ' : 'Quase. ') + m.exp);
  }})));
  addVoz(10);
  // dia da eleição
  st.eleicao = true; scene.background.copy(SKY_ELEICAO); scene.fog.color.copy(SKY_ELEICAO); sun.color.set('#FFE2C2');
  NPCS.homem.visible = true;
  await chapter(0, 'Dia da eleição');
  await info('Antes de sair', 'Checklist do dia', `<ul class="list">${DIA.map(d=>`<li>${d}</li>`).join('')}</ul>`, 'Bora votar');
  await goTo('Vá votar na escola', [{at:'escola', r:3.2, run: async()=>{
    lookAtPlayer('homem');
    await say('Homem do adesivo', 'Ei! Te dou R$ 50 se você votar no meu candidato. Ninguém vai saber.');
    const c = await choose(['Recusar e denunciar no app Pardal','Recusar e seguir em frente','Aceitar. São só R$ 50.'], 'Homem do adesivo');
    st.ch.g = c; rec(5, ['Denunciou a compra de voto','Recusou a compra de voto','Aceitou o dinheiro'][c]);
    await say(null, [
      'Você recusa e registra a denúncia no Pardal, o aplicativo da Justiça Eleitoral para denunciar irregularidades na campanha.',
      'Você recusa e segue. Se quiser, ainda dá pra denunciar depois pelo app Pardal, da Justiça Eleitoral.',
      `Pela lei, comprar e vender voto é crime (art. 299 do Código Eleitoral), pra quem oferece e pra quem aceita. E esse voto ajuda a escolher quem cuida de ${T().nome.toLowerCase()} por quatro anos.`][c]);
    NPCS.homem.visible = false;
    await say(null, 'Na sala, você mostra o documento ao mesário e deixa o celular com ele. A colinha vai no bolso.');
    await urna();
    SFX.win(); addVoz(14);
  }}]);
  await say(null, 'Voto dado. Mas a parte que pouca gente faz começa agora: acompanhar quem foi eleito.');
  const d = await choose(['Seguir os vereadores eleitos e ver como votam',`Mandar uma sugestão sobre ${T().nome.toLowerCase()} para a Câmara`,'Chamar a turma pra uma audiência pública'], null, 'O que você faz nos próximos meses?');
  st.ch.d = d; rec(5, ['Vai acompanhar as votações','Vai mandar sugestões à Câmara','Vai levar a turma a uma audiência pública'][d]);
  addVoz(100);
  await sleep(600);
  return final();
}
const CAPFN = [null, cap1, cap2, cap3, cap4, cap5];

/* ---------- urna ---------- */
function urna(){
  return new Promise(res=>{
    ui.lock++;
    const u = {etapa:0, d:'', branco:false, fim:false};
    const cargos = [{n:'VEREADOR', d:5},{n:'PREFEITO', d:2}];
    const draw = () => {
      const c = cargos[u.etapa];
      let tela;
      if(u.fim) tela = '<div style="margin:auto;font-size:46px;font-weight:800;letter-spacing:.06em">FIM</div>';
      else {
        const full = u.d.length===c.d;
        tela = `<span>SEU VOTO PARA</span><span class="cargo">${c.n}</span>
          ${u.branco ? '<span style="font-weight:800;font-size:18px;margin:8px 0">VOTO EM BRANCO</span>' : `<div class="digs">${Array.from({length:c.d},(_,k)=>`<span>${u.d[k]||''}</span>`).join('')}</div>`}
          ${full && !u.branco ? '<span><b>Nome:</b> Candidatura de exemplo<br><b>Partido:</b> Fictício</span>' : ''}
          <span class="inst">Aperte a tecla:<br>CONFIRMA para CONFIRMAR<br>CORRIGE para REINICIAR</span>`;
      }
      const o = overlay('center', `<div class="card" role="dialog" aria-modal="true"><span class="k">Cabine de votação</span><h2>Sua vez</h2>
        <p>Digite qualquer número para simular. Nenhum candidato real aparece aqui.</p>
        <div class="urna"><div class="tela" aria-live="polite">${tela}</div>
          <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="z" data-n="0">0</button></div>
          <div class="acoes"><button class="branco" data-a="b">BRANCO</button><button class="corrige" data-a="c">CORRIGE</button><button class="confirma" data-a="ok">CONFIRMA</button></div>
        </div>${u.fim ? '<button class="btn" id="sair">Sair da cabine</button>' : ''}</div>`);
      o.querySelectorAll('.teclado button').forEach(b=>b.onclick=()=>{ if(u.fim||u.branco||u.d.length>=c.d) return; u.d += b.dataset.n; SFX.key(); draw(); });
      o.querySelectorAll('.acoes button').forEach(b=>b.onclick=()=>{
        if(u.fim) return; const a = b.dataset.a; SFX.key();
        if(a==='c'){ u.d=''; u.branco=false; }
        if(a==='b' && !u.d) u.branco = true;
        if(a==='ok'){
          if(!(u.branco || u.d.length===c.d)) return;
          if(u.etapa===0){ u.etapa=1; u.d=''; u.branco=false; SFX.ok(); } else { u.fim=true; SFX.urnaFim(); }
        }
        draw();
      });
      const s = o.querySelector('#sair'); if(s) s.onclick = () => { ovl.innerHTML=''; ui.lock--; res(); };
    };
    draw();
  });
}

function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; }); }
function portrait(){
  const r = new THREE.WebGLRenderer({alpha:true, antialias:true, preserveDrawingBuffer:true});
  r.setSize(640,640,false);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight('#ffffff','#9aa3c7',1));
  const dl = new THREE.DirectionalLight('#ffffff',.7); dl.position.set(3,5,6); sc.add(dl);
  const ch = makeChar(st.skin); ch.rotation.y = .3;
  ch.userData.armR.rotation.x = -2.75; ch.userData.armR.rotation.z = .25;
  const card = new THREE.Group(); card.position.set(0,-.95,.15); ch.userData.armR.add(card);
  box(.55,.38,.04,'#2F4BFF',0,0,0,card);
  sc.add(ch);
  const cam = new THREE.PerspectiveCamera(30,1,.1,50); cam.position.set(0,1.6,5.9); cam.lookAt(0,1.5,0);
  r.render(sc, cam);
  const url = r.domElement.toDataURL('image/png'); r.dispose();
  return loadImg(url);
}
async function makeCard(){
  try{ await Promise.race([Promise.all([document.fonts.load('120px Anton'), document.fonts.load('700 40px Outfit')]), sleep(1500)]); }catch(e){}
  const W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle='#2F4BFF'; x.fillRect(0,0,W,H);
  x.save(); x.translate(W/2, 640); x.fillStyle='#3D58FF';
  for(let i=0;i<20;i++){ x.beginPath(); x.moveTo(0,0); const a=i*Math.PI/10; x.arc(0,0,1600,a,a+Math.PI/20); x.closePath(); x.fill(); }
  x.restore();
  x.textAlign='center'; x.fillStyle='#FFFFFF'; x.font='124px Anton, Impact, sans-serif';
  x.fillText('MEU PRIMEIRO VOTO', W/2, 196);
  const w = x.measureText('CONSCIENTE').width;
  x.fillStyle='#E6FF3B'; x.fillRect(W/2-w/2-26, 222, w+52, 136);
  x.fillStyle='#111216'; x.fillText('CONSCIENTE', W/2, 336);
  const img = await portrait(); x.drawImage(img, W/2-330, 360, 660, 660);
  x.fillStyle='#FFFFFF'; const bx=64, by=1000, bw=W-128, bh=250;
  x.beginPath(); x.roundRect ? x.roundRect(bx,by,bw,bh,28) : x.rect(bx,by,bw,bh); x.fill();
  x.textAlign='left'; x.fillStyle='#111216'; x.font='800 46px Outfit, sans-serif';
  x.fillText(`${N()} · tema: ${T().nome.toLowerCase()}`, bx+40, by+72);
  x.font='500 33px Outfit, sans-serif'; x.fillStyle='#2F4BFF';
  const linhas = [
    `✓  Chequei ${st.acertos} de ${st.checks} boatos e golpes`,
    st.ch.p===0 ? '✓  Decidi meu voto por conta própria' : '✓  Ouvi quem confio e comparei propostas',
    ['✓  Vou acompanhar como os eleitos votam','✓  Vou mandar sugestões para a Câmara','✓  Vou levar a turma a uma audiência'][st.ch.d||0]
  ];
  linhas.forEach((l,i)=>x.fillText(l, bx+40, by+130+i*44));
  x.textAlign='center'; x.fillStyle='#FFFFFF'; x.font='600 30px Outfit, sans-serif';
  x.fillText('@projetomidiando  ·  Antes do Título', W/2, 1305);
  return cv.toDataURL('image/png');
}
async function final(){
  ui.lock++;

      <div class="aula"><b>Pra conversar em sala</b><p>O que você respondeu quando o Léo disse que política é tudo igual? Por quê? Alguém da turma escolheu diferente e chegou ao mesmo lugar?</p></div>
    </div>

function restart(){
  const skin = {...st.skin}, nome = st.nome;
  st = st0(); st.skin = skin; st.nome = nome;
  quest = null; ui.lock = 0; ui.keyFn = null;
  scene.background.copy(SKY_DAY); scene.fog.color.copy(SKY_DAY); sun.color.set('#fff6e8');
  NPCS.homem.visible = false;
  player.position.set(-20,0,8.6); player.rotation.y = Math.PI;
  $('#hVoz').style.width = '0%'; updateObj();

/* =========================================================
   CONTROLES
   ========================================================= */
const keys = {};
addEventListener('keydown', e => {
  if(ui.keyFn){ ui.keyFn(e); return; }
  if(e.target.tagName==='INPUT') return;
  keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const joy = $('#joy'), knob = $('#knob'); const jv = {x:0, y:0}; let jid = null, jc = null;
joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); const r = joy.getBoundingClientRect(); jc = {x:r.left+r.width/2, y:r.top+r.height/2}; jmove(e); });
joy.addEventListener('pointermove', e => { if(e.pointerId===jid) jmove(e); });
const jend = e => { if(e.pointerId!==jid) return; jid=null; jv.x=jv.y=0; knob.style.transform=''; };
joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);
function jmove(e){
  let dx = e.clientX-jc.x, dy = e.clientY-jc.y; const d = Math.hypot(dx,dy), m = 46;
  if(d > m){ dx = dx/d*m; dy = dy/d*m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`; jv.x = dx/m; jv.y = dy/m;
}

/* =========================================================
   LOOP
   ========================================================= */
let mode = 'title', last = performance.now(), stepT = 0, t = 0;
const camTarget = V3(0,0,0);
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

function frame(nowMs){
  const dt = Math.min(.05, (nowMs-last)/1000); last = nowMs; t += dt;
  CLOUDS.forEach((c,i)=>{ c.position.x += dt*(.6+i*.08); if(c.position.x > 80) c.position.x = -80; });
  Object.values(NPCS).forEach(n=>animChar(n,false,dt));

  if(mode==='title'){
    const a = t*.06; camera.position.set(Math.sin(a)*58, 34, Math.cos(a)*58); camera.lookAt(0,0,-4);
  } else if(mode==='custom'){
    player.rotation.y += dt*.7; animChar(player,false,dt);
    camera.position.lerp(V3(player.position.x, 2.6, player.position.z-11), 1-Math.exp(-dt*6)); camera.lookAt(player.position.x, 1.2, player.position.z);
    const sheetH = (document.querySelector('.sheetbox')?.offsetHeight || 0);
    camera.setViewOffset(innerWidth, innerHeight, 0, sheetH*.45, innerWidth, innerHeight);
  } else if(player){
    let mx = 0, mz = 0;
    if(!ui.lock){
      if(keys['a']||keys['arrowleft']) mx -= 1; if(keys['d']||keys['arrowright']) mx += 1;
      if(keys['w']||keys['arrowup']) mz -= 1; if(keys['s']||keys['arrowdown']) mz += 1;
      mx += jv.x; mz += jv.y;
    }
    const len = Math.hypot(mx,mz), moving = len > .12;
    if(moving){
      const sp = 8.5 * Math.min(1,len) / Math.max(1,len);
      player.position.x += mx*sp*dt; player.position.z += mz*sp*dt;
      const target = Math.atan2(mx, mz); let d = target - player.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * Math.min(1, dt*12);
      stepT -= dt; if(stepT <= 0){ SFX.step(); stepT = .3; }
      const p = player.position, R = .45;
      for(const o of OBS){
        if(p.x>o.minX-R && p.x<o.maxX+R && p.z>o.minZ-R && p.z<o.maxZ+R){
          const dl=p.x-(o.minX-R), dr=(o.maxX+R)-p.x, du=p.z-(o.minZ-R), dd=(o.maxZ+R)-p.z, m=Math.min(dl,dr,du,dd);
          if(m===dl) p.x=o.minX-R; else if(m===dr) p.x=o.maxX+R; else if(m===du) p.z=o.minZ-R; else p.z=o.maxZ+R;
        }
      }
      p.x = Math.max(-60, Math.min(60, p.x)); p.z = Math.max(-58, Math.min(58, p.z));
    }
    animChar(player, moving, dt);
    const k = camera.aspect < 1 ? 1.4 : 1; camTarget.set(player.position.x, 19*k, player.position.z+10.5*k);
    camera.position.lerp(camTarget, 1-Math.exp(-dt*5));
    camera.lookAt(player.position.x, 1, player.position.z-1);

    // NPCs olham para quem chega perto
    Object.values(NPCS).forEach(n=>{
      if(!n.visible) return;
      const dx = player.position.x-n.position.x, dz = player.position.z-n.position.z;
      const want = (dx*dx+dz*dz < 30) ? Math.atan2(dx,dz) : n.userData.baseRot;
      let d = want - n.rotation.y; d = Math.atan2(Math.sin(d),Math.cos(d)); n.rotation.y += d*Math.min(1,dt*4);
    });

    // objetivos
    guide.visible = false;
    if(quest){
      let best = null, bd = 1e9;
      for(const q of quest.targets){
        if(q.done) continue;
        const m = q.marker; m.userData.gem.rotation.y += dt*2; m.userData.gem.position.y = 3.6 + Math.sin(t*3)*.2;
        const s = 1 + Math.sin(t*4)*.08; m.userData.ring.scale.set(s,1,s);
        if(m.userData.prop){ m.userData.prop.rotation.y += dt*1.6; m.userData.prop.position.y = 1.3 + Math.sin(t*2.5)*.12; }
        const d = Math.hypot(q.pos.x-player.position.x, q.pos.z-player.position.z);
        if(d < bd){ bd = d; best = q; }
        if(!ui.lock && !q.busy && d < q.r){ q.busy = true; arrive(q); }
      }
      if(best && bd > 4.5 && !ui.lock){
        const a = Math.atan2(best.pos.x-player.position.x, best.pos.z-player.position.z);
        guide.visible = true; guide.position.set(player.position.x+Math.sin(a)*1.6, .25, player.position.z+Math.cos(a)*1.6); guide.rotation.y = a;
      }
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

  </div>`);
  o.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    st.skin[b.dataset.o] = b.dataset.v; SFX.click(); buildPlayer();

function startGame(cap){
  mode = 'play';
  camera.clearViewOffset();
  player.rotation.y = Math.PI;
  $('#hud').hidden = false;
  const coarse = matchMedia('(pointer:coarse)').matches;
  $('#joy').hidden = !coarse; $('#kbd').hidden = coarse;
  addVoz(0);
  CAPFN[cap]();
}

   INÍCIO

async function boot(data){
  try{ await Promise.race([document.fonts.load('64px Anton'), sleep(1500)]); }catch(e){}
  buildWorld(); spawnNPCs(); resize();
  setSound(true);
  $('#snd').onclick = () => { audioInit(); setSound(!AU.on); };
  $('#loading').remove();
  requestAnimationFrame(frame);
  const saved = data && data.st;
  if(saved && saved.cap){
    st = Object.assign(st0(), saved, {rec:saved.rec||[]});
    buildPlayer(); VOICE[st.nome] = 330;
    if(st.eleicao){ scene.background.copy(SKY_ELEICAO); NPCS.homem.visible = true; }
    $('#hVoz').style.width = st.voz + '%';
    startGame(st.cap);
  } else titleScreen();
}
window.claude?.hot?.snapshot?.(() => ({st}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
