<style>
/* Layout: coluna única de celular. Capa e cartão final em azul com raios suaves (como os posts do @projetomidiando); jogo em fundo claro, sem ornamento. */
:root{
  --blue:#2F4BFF; --blue-2:#3D58FF; --lime:#E6FF3B; --orange:#FF5A1F; --green:#BFFF8A;
  --ink:#111216; --ink-2:#5A5D6B; --line:#DCDEE6; --paper:#FFFFFF; --bg:#F4F5F0;
  --f-display:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{max-width:440px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.005em;line-height:.95;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.lime{background:var(--lime);color:var(--ink);padding:0 .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;color:var(--ink);text-decoration:none}
.brand span{color:var(--blue)}
.count{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}

.rays{background:repeating-conic-gradient(from 0deg at 50% 30%,var(--blue) 0 9deg,var(--blue-2) 9deg 18deg);color:#fff;border-radius:var(--r);padding:28px 22px 24px;display:flex;flex-direction:column;gap:16px}
.rays h1{font-size:clamp(46px,14vw,64px)}
.rays p{font-size:16.5px;max-width:34ch}

.panel{background:var(--paper);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:22px;color:var(--blue);width:18px;flex:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:13px;font-weight:700;padding:3px 10px;border-radius:4px}
.k-confiavel{background:var(--green)}.k-falso{background:var(--orange);color:#fff}.k-contexto{background:var(--blue);color:#fff}

.btn{display:flex;align-items:center;justify-content:center;width:100%;border-radius:999px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--ink);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.limeb{background:var(--lime);color:var(--ink)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.note{font-size:12.5px;color:var(--ink-2);text-align:center}

/* posts simulados: neutros, como a tela de um app */
.post{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:var(--ink)}
.who{min-width:0;line-height:1.25}
.who b{display:block;font-weight:700;font-size:15px}
.who span{font-size:12.5px;color:var(--ink-2)}
.verified{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;vertical-align:1px;margin-left:4px}
.ptext{padding:0 12px 12px;font-size:15.5px}
.pimg{line-height:0;background:#eee}
.pimg svg{width:100%;height:auto;display:block}
.pfoot{padding:0 12px 12px;font-size:13px;color:var(--ink-2);display:flex;gap:14px}
.zap{background:#ECF3E8}
.zap .bubble{margin:0 12px 12px;background:var(--paper);border-radius:4px 12px 12px 12px;padding:8px 11px 6px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.zap .fwd{display:block;font-size:12px;color:var(--ink-2);font-style:italic;margin-bottom:3px}
.zap .time{display:block;text-align:right;font-size:11px;color:var(--ink-2)}
.site .domain{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.site .domain b{color:var(--ink);font-weight:700}
.site .shared{padding:10px 12px 0;font-size:12.5px;color:var(--ink-2)}
.site h3{font-family:var(--f-body);text-transform:none;font-weight:800;font-size:20px;line-height:1.2;padding:10px 12px 4px;letter-spacing:-.01em}
.site .date{padding:0 12px;font-size:13px;color:var(--ink-2)}
.site .lede{padding:8px 12px 14px;font-size:15px}
.quote{background:var(--ink);color:#fff;padding:26px 20px;font-family:var(--f-display);text-transform:uppercase;font-size:28px;line-height:1}
.quote small{display:block;font-family:var(--f-body);text-transform:none;font-weight:600;font-size:14px;margin-top:12px;color:var(--lime)}

/* investigação */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pista{border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13.5px;line-height:1.15;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--paper)}
.pista svg{width:22px;height:22px}
.pista.on{background:var(--ink);color:#fff;box-shadow:none}
.pista[disabled]:not(.on){opacity:.35;cursor:not-allowed}
.pista.key{box-shadow:inset 0 0 0 2px var(--blue)}
.reveal{background:var(--lime);border-radius:6px;padding:12px 14px;font-size:15px}
.reveal .label{color:var(--ink);display:block;margin-bottom:3px}

.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vbtn{border-radius:10px;padding:14px 4px;font-weight:700;font-size:15px;line-height:1.1;transition:opacity .2s}
.vbtn[data-v="confiavel"]{background:var(--green)}
.vbtn[data-v="falso"]{background:var(--orange);color:#fff}
.vbtn[data-v="contexto"]{background:var(--blue);color:#fff}
.vbtn[disabled]{opacity:.25;cursor:default}
.vbtn.picked{opacity:1}

.feedback{background:var(--paper);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .3s ease-out}
.feedback h2{font-size:34px}
.feedback .ok{color:var(--blue)}.feedback .no{color:var(--orange)}
.feedback dl{margin:0;display:flex;flex-direction:column;gap:10px}
.feedback dd{margin:2px 0 0}
@keyframes up{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}

/* resultado */
.card{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:24px 22px;color:#fff;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--blue) 0 9deg,var(--blue-2) 9deg 18deg)}
.card .k{font-family:var(--f-display);font-size:16px;letter-spacing:.06em}
.card h2{font-size:clamp(40px,12vw,56px)}
.card .perfil{display:inline;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(34px,10vw,46px);line-height:1.12}
.card .stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.card .stats b{display:block;font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1}
.card .stats span{font-size:12.5px;font-weight:600;opacity:.9}
.card .foot{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review li{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.review .m{flex:none;font-weight:800;width:16px}
.review .m.ok{color:var(--blue)}.review .m.no{color:var(--orange)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>

<div class="stage" id="app"></div>

  aprendiz:{nome:'Aprendiz de checagem', txt:'Você já sabe onde procurar. Falta treinar o olho para datas, @ parecidos e fotos recicladas.'},
  desconfiado:{nome:'Desconfiança no máximo', txt:'Você desconfiou até do que era verdade. Checar serve para separar, não para descartar tudo.'},
  apressado:{nome:'Compartilhador apressado', txt:'Você respondeu rápido e investigou pouco. Uma pista leva 10 segundos.'}
};

const st = {tela:'inicio', i:0, ordem:[], pista:null, resp:null, hist:[], t0:0, t1:0};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPost(q){
  const head = `<div class="phead"><div class="av" style="background:${q.cor}">${q.ini}</div><div class="who"><b>${esc(q.autor)}${q.verificado?'<span class="verified" aria-label="verificado">✓</span>':''}</b><span>${esc(q.handle?q.handle+' · ':'')}${esc(q.meta)}</span></div></div>`;
  if(q.tipo==='zap') return `<article class="post zap">${head}<div class="bubble"><span class="fwd">↪↪ ${esc(q.meta)}</span><p>${esc(q.texto)}</p><span class="time">07:42 ✓✓</span></div></article>`;
  if(q.tipo==='site') return `<article class="post site"><div class="domain">🔒 <b>${esc(q.dominio)}</b></div>${q.compartilhado?`<div class="shared">↪ ${esc(q.compartilhado)}</div>`:''}<h3>${esc(q.titulo)}</h3><div class="date">${esc(q.veiculo)} · ${esc(q.data)}</div><p class="lede">${esc(q.texto)}</p></article>`;
  if(q.tipo==='quote') return `<article class="post">${head}<div class="quote">${esc(q.frase)}<small>${esc(q.fala)}</small></div><p class="ptext" style="padding-top:12px">${esc(q.texto)}</p></article>`;
  if(q.tipo==='tweet') return `<article class="post">${head}<p class="ptext">${esc(q.texto)}</p><div class="pfoot"><span>↻ 4,1 mil</span><span>♥ 9,8 mil</span></div></article>`;
  return `<article class="post">${head}${q.img?`<div class="pimg">${IMG[q.img]}</div>`:''}<p class="ptext" style="padding-top:12px"><b>${esc(q.autor)}</b> ${esc(q.texto)}</p></article>`;
}

function inicio(){
  app.innerHTML = `
  <div class="top"><a class="brand" href="../">MIDIANDO <span>· QUIZ</span></a><span class="count">9 posts · 4 min</span></div>
  <section class="rays">
    <span class="label" style="color:#fff;opacity:.85">Quiz Midiando</span>
    <h1>Antes de compartilhar, <span class="lime">investigue.</span></h1>
    <p>Posts, prints e notícias que circulam por aí. Em cada um, abra uma pista e dê o seu veredito.</p>
  </section>
  <section class="panel">
    <ol class="steps">
      <li><span>Leia o post com calma.</span></li>
      <li><span>Abra <b>uma</b> pista: quem postou, quando ou de onde veio.</span></li>
      <li><span>Decida se é confiável, falso ou fora de contexto.</span></li>
    </ol>
    <div class="keys"><span class="key k-confiavel">Confiável</span><span class="key k-falso">Falso</span><span class="key k-contexto">Fora de contexto</span></div>
    <button class="btn" id="go">Começar</button>
    <p class="note">Protótipo. Posts, perfis e pessoas são fictícios, criados para treinar checagem.</p>
  </section>`;
  document.getElementById('go').onclick = comecar;
}

function comecar(){
  st.ordem = Q.map((_,k)=>k).sort(()=>Math.random()-.5);
  st.i=0; st.hist=[]; st.pista=null; st.resp=null; st.t0=Date.now(); st.tela='jogo';
  render();
}

function jogo(){
  const q = Q[st.ordem[st.i]];
  const pts = st.hist.reduce((s,h)=>s+h.pts,0);
  const respondeu = !!st.resp;
  const pistasHtml = ['quem','quando','origem'].map(p=>{
    const on = st.pista===p;
    const dis = (st.pista && !on) || respondeu;
    const key = respondeu && q.chave===p && !on;
    return `<button class="pista ${on?'on':''} ${key?'key':''}" data-p="${p}" ${dis||on?'disabled':''} aria-pressed="${on}">${ICON[p]}${PISTA_LABEL[p]}</button>`;
  }).join('');
  let reveal = '';
  if(st.pista) reveal = `<div class="reveal"><span class="label">${PISTA_LABEL[st.pista]}</span>${esc(q.pistas[st.pista])}</div>`;
  const verd = Object.keys(VLABEL).map(v=>`<button class="vbtn ${st.resp===v?'picked':''}" data-v="${v}" ${respondeu?'disabled':''}>${VLABEL[v]}</button>`).join('');

  let fb = '';
  if(respondeu){
    const h = st.hist[st.hist.length-1];
    fb = `<section class="feedback" aria-live="polite">
      <h2 class="${h.ok?'ok':'no'}">${h.ok?'Acertou':'Não foi dessa vez'}</h2>
      <p>Este post é <b>${VLABEL[q.resposta].toLowerCase()}</b>. <span class="muted">+${h.pts} pts</span></p>
      <dl>
        <div><dt class="label">O sinal</dt><dd>${esc(q.sinal)}</dd></div>
        <div><dt class="label">A pista que entregava</dt><dd>${PISTA_LABEL[q.chave]}${st.pista===q.chave?' Foi a que você abriu.':` <span class="muted small">${esc(q.pistas[q.chave])}</span>`}</dd></div>
        <div><dt class="label">Como checar</dt><dd>${esc(q.dica)}</dd></div>
      </dl>
      <button class="btn" id="next">${st.i<Q.length-1?'Próximo post':'Ver meu perfil'}</button>
    </section>`;
  }

  app.innerHTML = `
  <div class="top"><a class="brand" href="../">MIDIANDO <span>· QUIZ</span></a><span class="count">${st.i+1}/${Q.length} · ${pts} pts</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${(st.i+(respondeu?1:0))/Q.length*100}%"></i></div>
  ${renderPost(q)}
  <section class="panel">
    <span class="label">Investigue (1 pista)</span>
    <div class="seg">${pistasHtml}</div>
    ${reveal}
    <span class="label">Seu veredito</span>
    <div class="verdicts">${verd}</div>
  </section>
  ${fb}`;

  app.querySelectorAll('.pista').forEach(b=>b.onclick=()=>{ if(!st.pista && !st.resp){ st.pista=b.dataset.p; render(); }});
  app.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>responder(b.dataset.v));
  const nx = document.getElementById('next');
  if(nx) nx.onclick = proximo;
  if(nx && st.scroll){ st.scroll=false; document.querySelector('.feedback').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'}); }
}

function responder(v){
  if(st.resp) return;
  const q = Q[st.ordem[st.i]];
  const ok = v===q.resposta;
  const pts = (ok?100:0) + (st.pista?10:0) + (st.pista===q.chave?40:0);
  st.resp = v; st.scroll = true;
  st.hist.push({q:st.ordem[st.i], v, ok, pista:st.pista, pistaCerta:st.pista===q.chave, pts});
  render();
}

function proximo(){
  if(st.i<Q.length-1){ st.i++; st.pista=null; st.resp=null; }
  else { st.t1=Date.now(); st.tela='fim'; }
  render(); window.scrollTo(0,0);
}

function perfil(){
  const ac = st.hist.filter(h=>h.ok).length;
  const usadas = st.hist.filter(h=>h.pista).length;
  const verdadeirasErradas = st.hist.filter(h=>Q[h.q].resposta==='confiavel' && !h.ok).length;
  if(usadas<=3) return 'apressado';
  if(ac>=8) return 'detetive';
  if(verdadeirasErradas>=2) return 'desconfiado';
  if(ac<=4 && usadas<=5) return 'apressado';
  return 'aprendiz';
}

function fim(){
  const ac = st.hist.filter(h=>h.ok).length;
  const usadas = st.hist.filter(h=>h.pista).length;
  const certas = st.hist.filter(h=>h.pistaCerta).length;
  const pts = st.hist.reduce((s,h)=>s+h.pts,0);
  const seg = Math.max(1,Math.round((st.t1-st.t0)/1000));
  const tempo = `${Math.floor(seg/60)}min${String(seg%60).padStart(2,'0')}s`;
  const p = PERFIS[perfil()];
  const review = st.hist.map(h=>{
    const q=Q[h.q]; const t=q.titulo||q.frase||q.texto;
    return `<li><span class="m ${h.ok?'ok':'no'}">${h.ok?'✓':'✕'}</span><span style="min-width:0">${esc(t.length>70?t.slice(0,68)+'…':t)} <span class="muted small">· ${VLABEL[q.resposta]}</span></span></li>`;
  }).join('');
  app.innerHTML = `
  <div class="top"><a class="brand" href="../">MIDIANDO <span>· QUIZ</span></a><span class="count">Resultado</span></div>
  <div class="card">
    <span class="k">QUIZ MIDIANDO</span>
    <div>
      <h2>No quiz, eu sou</h2>
      <span class="perfil lime">${p.nome}</span>
    </div>
    <div class="stats">
      <div><b>${ac}/${Q.length}</b><span>acertos</span></div>
      <div><b>${usadas}</b><span>pistas</span></div>
      <div><b>${pts}</b><span>pontos</span></div>
    </div>
    <div class="foot"><span>@projetomidiando</span><span>Antes de compartilhar, investigue</span></div>
  </div>
  <p class="note">Tire um print do cartão para postar nos stories.</p>
  <div class="row"><button class="btn limeb" id="copy">Copiar legenda</button><button class="btn ghost" id="again">Jogar de novo</button></div>
  <section class="panel">
    <p>${p.txt}</p>
    <p class="small muted">${certas} de ${Q.length} vezes você abriu justamente a pista que entregava o sinal. Tempo: ${tempo}.</p>
    <ul class="review">${review}</ul>
  </section>`;
  document.getElementById('again').onclick = ()=>{ st.tela='inicio'; render(); window.scrollTo(0,0); };
  document.getElementById('copy').onclick = async ()=>{
    const txt = `No Quiz Midiando eu sou "${p.nome}": ${ac}/${Q.length} acertos. Antes de compartilhar, investigue! @projetomidiando`;
    try{ await navigator.clipboard.writeText(txt); toast('Legenda copiada'); }
    catch(e){ toast(txt); }
  };
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function render(){ ({inicio, jogo, fim})[st.tela](); }

function boot(data){ if(data && data.st) Object.assign(st, data.st); render(); }
window.claude?.hot?.snapshot?.(()=>({st}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
