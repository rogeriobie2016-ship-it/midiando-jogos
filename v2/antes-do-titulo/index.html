<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aventura 3D do Midiando sobre o primeiro título de eleitor: crie seu personagem, explore o bairro e descubra o peso da sua voz.">
<meta property="og:title" content="Antes do Título">
<meta property="og:description" content="Aventura 3D do Midiando sobre o primeiro título de eleitor: crie seu personagem, explore o bairro e descubra o peso da sua voz.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2F4BFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F4BFF'/%3E%3Crect x='12' y='34' width='40' height='16' fill='%23E6FF3B'/%3E%3Cpath d='M16 30V14h7l9 11 9-11h7v16h-7v-7l-9 10-9-10v7z' fill='%23fff'/%3E%3C/svg%3E">
<title>Antes do Título</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: mundo 3D em tela cheia; HUD discreto no topo, diálogo em cartão branco embaixo, telas de capítulo em azul Midiando. */
:root{
  --blue:#2F4BFF; --blue-2:#3D58FF; --lime:#E6FF3B; --orange:#FF5A1F; --green:#BFFF8A; --pink:#FF7AD9; --lilac:#E8CCFF;
  --ink:#111216; --ink-2:#5A5D6B; --line:#DCDEE6; --paper:#FFFFFF; --soft:#F2F3F7; --sky:#CFE6FF;
  --f-display:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
.lime{background:var(--lime);color:var(--ink);padding:0 .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{font-size:12.5px;color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border-radius:999px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--ink);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.blue{background:var(--blue)}
.btn.limeb{background:var(--lime);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px currentColor}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* HUD */
.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.obj{background:rgba(255,255,255,.95);border-radius:12px;padding:9px 12px 10px;max-width:min(72vw,380px);box-shadow:0 4px 18px rgba(17,18,22,.12)}
.obj .cap{font-family:var(--f-display);font-size:13px;letter-spacing:.07em;color:var(--blue);text-transform:uppercase}
.obj .txt{font-weight:700;font-size:15px;line-height:1.25;margin-top:1px}
.voz{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.voz b{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.voz i{display:block;height:100%;width:0;background:var(--blue);transition:width .8s ease}
.tools{display:flex;gap:6px;pointer-events:auto}
.icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 18px rgba(17,18,22,.12)}
.icon svg{width:20px;height:20px}
.toast{position:fixed;z-index:9;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap;animation:tin .25s ease-out}
.toast b{color:var(--lime)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.hint{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px}

/* joystick */
#joy{position:fixed;z-index:5;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(17,18,22,.2)}

/* diálogo */
.dlg{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:#fff;border-radius:16px;padding:20px 18px 14px;box-shadow:0 12px 40px rgba(17,18,22,.28);cursor:pointer;animation:din .2s ease-out}
@keyframes din{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.dlg .name{position:absolute;top:-13px;left:16px;background:var(--lime);font-family:var(--f-display);letter-spacing:.05em;font-size:16px;padding:2px 10px;text-transform:uppercase}
.dlg .text{font-size:17px;line-height:1.45;min-height:2.9em}
.dlg .text.narr{color:var(--ink-2);font-style:italic}
.dlg .more{display:block;text-align:right;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.choices{display:flex;flex-direction:column;gap:7px;margin-top:12px;cursor:default}
.choice{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:16px;line-height:1.3;transition:background .15s}
.choice:hover,.choice:focus-visible{background:var(--lime)}
.choice .n{font-family:var(--f-display);color:var(--blue);font-size:17px;flex:none}

/* sobreposições */
.ovl{position:fixed;inset:0;z-index:10;display:flex;justify-content:center}
.ovl.title{align-items:flex-end;background:linear-gradient(to top,rgba(17,18,22,.9) 0%,rgba(17,18,22,.72) 42%,rgba(17,18,22,0) 78%)}
.titlebox{width:min(560px,100%);padding:24px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));color:#fff;display:flex;flex-direction:column;gap:16px}
.titlebox .kick{font-family:var(--f-display);letter-spacing:.12em;font-size:15px;color:var(--lime)}
.titlebox h1{font-size:clamp(64px,19vw,104px);line-height:.98}
.titlebox h1 .lime{display:inline-block;line-height:1.02;padding:0 .12em;margin-top:.06em}
.titlebox p{font-size:16.5px;max-width:38ch;opacity:.92}
.titlebox .note{color:#fff;opacity:.75}
.ovl.sheet{align-items:flex-end;pointer-events:none}
.sheetbox{pointer-events:auto;width:min(560px,100%);max-height:58%;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(17,18,22,.2);user-select:auto}
.sheetbox h2{font-size:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.opt .lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.field input{border:0;border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;background:var(--soft)}
.opt{display:flex;flex-direction:column;gap:7px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(17,18,22,.15)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.tx{display:flex;flex-wrap:wrap;gap:6px}
.tx button{padding:7px 12px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px}
.tx button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ovl.center{align-items:center;background:rgba(17,18,22,.5);padding:16px}
.card{width:min(460px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:18px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;animation:din2 .25s ease-out;user-select:auto}
@keyframes din2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.card h2{font-size:34px}
.card p{font-size:16px;line-height:1.5}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.list li:first-child{border-top:0}
.list b{font-weight:700}
.ovl.chapter{align-items:center;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--blue) 0 9deg,var(--blue-2) 9deg 18deg);color:#fff;cursor:pointer;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.chap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.chap .n{background:var(--lime);color:var(--ink);font-family:var(--f-display);font-size:20px;letter-spacing:.08em;padding:2px 12px}
.chap h1{font-size:clamp(48px,14vw,92px);max-width:12ch}
.flash{position:fixed;inset:0;background:#fff;z-index:12;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* urna */
.urna{background:#d9d4c7;border-radius:14px;padding:12px;display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.tela{background:#f7f7f2;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:190px;font-size:13px}
.tela .cargo{font-weight:800;font-size:16px;letter-spacing:.04em}
.digs{display:flex;gap:4px}
.digs span{width:24px;height:30px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;background:#fff;font-variant-numeric:tabular-nums}
.tela .inst{margin-top:auto;border-top:1px solid var(--ink);padding-top:6px;font-size:11px;line-height:1.3}
.teclado{background:#2a2a30;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.teclado button{background:#111;color:#fff;border-radius:5px;padding:8px 0;font-weight:800;font-size:16px}
.teclado .z{grid-column:2}
.acoes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acoes button{border-radius:6px;padding:10px 2px;font-weight:800;font-size:12.5px;letter-spacing:.03em}
.acoes .branco{background:#fff}.acoes .corrige{background:#F58B2C}.acoes .confirma{background:#2BB24C;color:#fff}

/* final */
.ovl.final{background:var(--soft);overflow:auto;display:block;user-select:auto}
.fin{width:min(480px,100%);margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.fin img{width:100%;height:auto;border-radius:16px;display:block;box-shadow:0 10px 30px rgba(17,18,22,.18);-webkit-touch-callout:default}
.fin .panel{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.fin h2{font-size:28px}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.recap li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.recap li:first-child{border-top:0}
.recap .c{font-family:var(--f-display);color:var(--blue);flex:none;width:20px}
.aula{background:var(--lime);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;letter-spacing:.06em;color:var(--blue);z-index:20;background:var(--sky)}

/* v2: progresso, recompensas e mapa */
.obj{max-width:min(64vw,380px)}
.lvl{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink)}
.lvl b{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.lvl i{display:block;height:100%;width:0;background:#C6DB12;transition:width .6s}
.lvl em{font-style:normal;color:var(--ink-2)}
.tools{flex-direction:column;align-items:flex-end}
.pill{height:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.95);display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;box-shadow:0 4px 18px rgba(17,18,22,.12)}
.pill svg{width:18px;height:18px}
.side{position:fixed;z-index:5;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.side .icon{width:50px;height:50px}
.side .icon svg{width:22px;height:22px}
.camrow{display:flex;gap:8px;justify-content:flex-end}
.camrow .icon{width:44px;height:44px}
.hint{right:auto;left:max(16px,env(safe-area-inset-left,0px))}
.talk{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(17,18,22,.3);animation:tin .2s;white-space:nowrap}
.talk kbd{background:var(--lime);color:var(--ink);border-radius:6px;padding:1px 7px;margin-right:8px;font-family:inherit;font-weight:800}
.xpf{position:fixed;z-index:31;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--f-display);font-size:26px;color:var(--ink);background:var(--lime);padding:2px 12px;letter-spacing:.04em;pointer-events:none;white-space:nowrap;animation:xpup 1.3s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.medal{position:fixed;z-index:32;left:50%;top:calc(160px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 16px 10px 10px;box-shadow:0 12px 30px rgba(17,18,22,.25);animation:medal 3.2s ease forwards;white-space:nowrap}
.medal svg{width:46px;height:46px}
.medal span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.medal b{font-family:var(--f-display);font-size:22px;font-weight:400;text-transform:uppercase}
@keyframes medal{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}15%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
#fxc{position:fixed;inset:0;z-index:40;pointer-events:none}
.int{position:fixed;inset:0;z-index:15;background:#0E1230;color:#F4F5F0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));font-family:"Pixelify Sans",system-ui,sans-serif;overflow:auto;user-select:none}
.int-top{width:min(640px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}
.int-top b{font-family:"Press Start 2P",monospace;font-weight:400;font-size:11px;color:#E6FF3B;line-height:1.6}
.int-top button{font-family:"Press Start 2P",monospace;font-size:10px;background:#1B2150;color:#F4F5F0;padding:10px 12px;border-radius:10px}
#ic{width:min(640px,100%);height:auto;aspect-ratio:16/9;image-rendering:pixelated;border-radius:12px;background:#000;touch-action:none;display:block;box-shadow:0 0 0 2px #2E3A7A}
.iu{width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.pbox{position:relative;background:#F4F5F0;color:#111216;border-radius:12px;padding:18px 14px 12px;font-size:18px;line-height:1.35;min-height:84px;cursor:pointer}
.pbox .nm{position:absolute;top:-11px;left:12px;background:#E6FF3B;font-family:"Press Start 2P",monospace;font-size:9px;padding:5px 8px}
.pbox .more{display:block;text-align:right;font-family:"Press Start 2P",monospace;font-size:8px;color:#2F4BFF;margin-top:6px;animation:blink 1.2s infinite}
.pbtn{--c:#E6FF3B;--d:#A9BD10;--t:#111216;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 8px 13px;border-radius:12px;background:var(--c);color:var(--t);box-shadow:0 5px 0 var(--d);font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:.03em;flex:1;touch-action:manipulation;line-height:1.4}
.pbtn:active,.pbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.pbtn.g{--c:#3AD67A;--d:#1F8F4C}.pbtn.r{--c:#FF3B4E;--d:#A8182A;--t:#fff}.pbtn.b{--c:#2F4BFF;--d:#1C2FB0;--t:#fff}.pbtn.o{--c:#FF5A1F;--d:#B83A0C;--t:#fff}.pbtn.n{--c:#1B2150;--d:#0B0E2A;--t:#F4F5F0}
.prow{display:flex;gap:10px}
.pres{background:#1B2150;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center}
.pres h3{font-family:"Press Start 2P",monospace;font-weight:400;font-size:14px;color:#E6FF3B;line-height:1.5;margin:0;text-transform:none}
.pres p{font-size:17px}
.pres .lst{text-align:left;font-size:15px;color:#C9CDE8;max-height:28vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.prule{font-size:16px;color:#C9CDE8;text-align:center;line-height:1.4}
.card.ex{gap:12px}
.stmt{background:var(--soft);border-radius:12px;padding:14px;font-size:17px;line-height:1.45}
.stmt .who{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);text-align:center;font-weight:800;color:var(--blue)}
.tiles{display:grid;gap:8px}.tiles.c2{grid-template-columns:1fr 1fr}.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tile{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:12px 10px;font-weight:700;font-size:15.5px;line-height:1.25;text-align:center;transition:transform .06s;min-width:0}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.sel{border-color:var(--blue);background:#EEF1FF;color:var(--blue)}
.tile.ok{border-color:#2BB24C;background:#E6FBEA;color:#167A2E}
.tile.no{border-color:#E23B4E;background:#FFE7EA;color:#A8182A}
.tile.done{opacity:.25;pointer-events:none}
.tile[disabled]{cursor:default}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairs .col{display:flex;flex-direction:column;gap:8px}.pairs .tile{min-height:58px;font-size:14.5px}
.slots{min-height:96px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.slots .tile,.bank .tile{text-align:left;font-size:14.5px;padding:10px 12px}
.slots .tile .k{color:var(--blue);margin-right:6px;font-family:var(--f-display)}
.bank{display:flex;flex-direction:column;gap:6px}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.fb:empty{display:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{border-radius:12px;background:var(--soft);padding:10px 4px}
.stats span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:30px}
.chestbtn{width:120px;height:104px;animation:bob2 1s ease-in-out infinite}
.chestbtn svg{width:100%;height:100%}
.chestbtn.open{animation:pop2 .5s}
@keyframes bob2{50%{transform:translateY(-6px)}}
@keyframes pop2{40%{transform:scale(1.2) rotate(-5deg)}100%{transform:none}}
.reward{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 14px;text-align:left;width:100%}
.reward i{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 2px rgba(17,18,22,.12);display:grid;place-items:center;font-style:normal;font-weight:800}
.flamebig svg{width:96px;height:112px}
.mapsvg{width:100%;height:auto;border-radius:14px;background:#BFE89A;display:block}

.placeinfo{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:70px;font-size:15px;line-height:1.45}

.placeinfo em{font-style:normal;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:999px;background:var(--soft);font-weight:700;font-size:13px}
.chips button.v{background:#DCE3FF}

.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

];
const CAPS = ['O incômodo','Política não adianta','Quem decide isso?','A decisão','O caminho até a urna'];

/* opções de personagem */
const OPT = {
  pele:['#F3D3B5','#E0AC82','#B97A50','#8A5634','#5A3622'],
  cabelo:[['curto','Curto'],['afro','Black'],['coque','Coque'],['trancas','Tranças'],['longo','Longo'],['raspado','Raspado']],

  calca:['#1F2433','#3B5B92','#6B4E3D','#2F4BFF','#E8CCFF'],

/* =========================================================
   ESTADO
   ========================================================= */
const st0 = () => ({cap:0, nome:'', perfil:0, tema:'transporte', voz:0, ch:{}, rec:[], acertos:0, checks:0, xp:0, capXP:0, combo:0, medals:[], itens:[], megas:[], talked:[], visited:[], side:{},

const N = () => st.nome || 'Ari';
const T = () => TEMAS[st.tema];
const P = () => PERFIS[st.perfil];
function rec(cap, t){ st.rec.push([cap,t]); }

/* =========================================================
   ÁUDIO (tudo sintetizado com Web Audio)
   ========================================================= */
const AU = {ctx:null, on:true};
const midi = m => 440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
  const c = AU.ctx = new C();
  AU.master = c.createGain(); AU.master.gain.value = AU.on ? .9 : 0; AU.master.connect(c.destination);
  AU.sfx = c.createGain(); AU.sfx.gain.value = .55; AU.sfx.connect(AU.master);
  AU.mus = c.createGain(); AU.mus.gain.value = .2; AU.mus.connect(AU.master);
  const len = c.sampleRate*.25, b = c.createBuffer(1,len,c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  AU.noise = b;
  startMusic();
}
function tone(f, t0, dur, type='square', vol=.2, dest=AU.sfx, slide=0){
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t0+dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+.012); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0, dur, freq, vol){
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  s.connect(f); f.connect(g); g.connect(AU.sfx); s.start(t0); s.stop(t0+dur);
}
const now = () => AU.ctx.currentTime;
const SFX = {
  click(){ if(!AU.ctx) return; tone(900, now(), .05, 'triangle', .12); },
  talk(base){ if(!AU.ctx) return; tone(base*(.9+Math.random()*.25), now(), .05, 'square', .035); },
  step(){ if(!AU.ctx) return; noise(now(), .07, 260+Math.random()*120, .18); },
  pick(){ if(!AU.ctx) return; const t=now(); [72,76,79,84].forEach((m,i)=>tone(midi(m), t+i*.07, .18, 'triangle', .16)); },
  ok(){ if(!AU.ctx) return; const t=now(); tone(midi(76),t,.12,'square',.08); tone(midi(83),t+.1,.25,'square',.08); },
  no(){ if(!AU.ctx) return; tone(200, now(), .3, 'sawtooth', .06, AU.sfx, .55); },
  chapter(){ if(!AU.ctx) return; const t=now(); [60,64,67,72].forEach((m,i)=>tone(midi(m), t+i*.09, 1.4, 'triangle', .09)); tone(midi(48), t, 1.6, 'sine', .2); },
  win(){ if(!AU.ctx) return; const t=now(); [67,72,76,79,84].forEach((m,i)=>tone(midi(m), t+i*.1, .35, 'square', .06)); },
  shutter(){ if(!AU.ctx) return; const t=now(); noise(t,.05,3000,.4); noise(t+.07,.08,1800,.3); },
  key(){ if(!AU.ctx) return; tone(1250, now(), .06, 'square', .08); },
  urnaFim(){ if(!AU.ctx) return; const t=now(); for(let i=0;i<5;i++) tone(1050, t+i*.11, i===4?.5:.07, 'square', .08); },
  vibra(){ if(!AU.ctx) return; const t=now(); tone(120,t,.15,'sawtooth',.06); tone(120,t+.2,.15,'sawtooth',.06); }
};
const PROG = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]];
function startMusic(){
  let step = 0, nt = AU.ctx.currentTime + .15; const e8 = 60/98/2;
  setInterval(()=>{
    if(!AU.ctx || AU.ctx.state!=='running') return;
    while(nt < AU.ctx.currentTime + .3){
      const bar = Math.floor(step/8)%4, e = step%8, ch = PROG[bar], arp = [0,2,1,3,2,1,3,2];
      tone(midi(ch[arp[e]]+12), nt, .26, 'triangle', .07, AU.mus);
      if(e===0||e===4) tone(midi(ch[0]-12), nt, .45, 'sine', .22, AU.mus);
      if(e===0) ch.forEach(m=>tone(midi(m), nt, e8*8, 'sine', .028, AU.mus));
      if(e===2||e===6) noise(nt, .04, 7000, .05);
      nt += e8; step++;
    }
  }, 60);
}
function setSound(on){
  AU.on = on;
  if(AU.master) AU.master.gain.setTargetAtTime(on ? .9 : 0, AU.ctx.currentTime, .05);
  $('#snd').innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#111216" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#111216" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  $('#snd').setAttribute('aria-label', on ? 'Desligar som' : 'Ligar som');
}
document.addEventListener('visibilitychange', ()=>{ if(!AU.ctx) return; document.hidden ? AU.ctx.suspend() : AU.ctx.resume(); });

/* =========================================================

const canvas = $('#c');

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const mats = {};
const M = c => mats[c] || (mats[c] = new THREE.MeshStandardMaterial({color:c, roughness:.88, metalness:0, flatShading:true}));
function mesh(geo, color, x=0, y=0, z=0, parent=scene, shadow=true){
  const m = new THREE.Mesh(geo, M(color)); m.position.set(x,y,z);
  if(shadow){ m.castShadow = true; m.receiveShadow = true; }
  parent.add(m); return m;
}
const box = (w,h,d,c,x,y,z,p) => mesh(new THREE.BoxGeometry(w,h,d), c, x, y, z, p);
const OBS = [];
function obstacle(x,z,w,d){ OBS.push({minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2}); }

function labelSprite(text, bg='#111216', fg='#FFFFFF', h=1.3){
  const cv = document.createElement('canvas'), x = cv.getContext('2d');
  x.font = '64px Anton, Impact, sans-serif';
  const w = Math.ceil(x.measureText(text).width) + 48;
  cv.width = w; cv.height = 100;
  x.fillStyle = bg; x.fillRect(0,0,w,100);
  x.font = '64px Anton, Impact, sans-serif'; x.fillStyle = fg; x.textBaseline = 'middle'; x.fillText(text, 24, 54);
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  s.scale.set(h*w/100, h, 1); return s;
}

const PLACES = {};
function building(o){
  const g = new THREE.Group(); g.position.set(o.x, 0, o.z);
  g.rotation.y = {'+z':0,'-z':Math.PI,'+x':Math.PI/2,'-x':-Math.PI/2}[o.face||'+z'];
  scene.add(g);
  box(o.w, o.h, o.d, o.wall, 0, o.h/2, 0, g);
  box(o.w+.6, .5, o.d+.6, o.roof, 0, o.h+.25, 0, g);
  box(1.8, 2.6, .2, o.door||'#2B2D38', 0, 1.3, o.d/2+.05, g);
  const nWin = Math.max(1, Math.floor((o.w-3)/3.2));
  for(let i=0;i<nWin;i++){
    const xx = -o.w/2 + 1.6 + i*((o.w-3.2)/Math.max(1,nWin-1||1));
    if(Math.abs(xx) < 1.6) continue;
    box(1.3, 1.1, .12, '#DDEBFF', xx, o.h*.62, o.d/2+.06, g);
  }
  if(o.cols){ for(let i=-3;i<=3;i++){ if(i===0) continue; mesh(new THREE.CylinderGeometry(.35,.35,o.h,10), '#FFFFFF', i*2.6, o.h/2, o.d/2+1.2, g); } box(o.w, .6, 2.6, o.roof, 0, o.h+.1, o.d/2+1.1, g); }
  const sideways = o.face==='+x' || o.face==='-x';
  MAPB.push({x:o.x, z:o.z, w:sideways?o.d:o.w, d:(sideways?o.w:o.d)+(o.cols?2.6:0), c:o.wall});
  obstacle(o.x, o.z, (sideways?o.d:o.w)+(o.cols?0:0), (sideways?o.w:o.d)+(o.cols?2.6:0));
  const out = new THREE.Vector3(0, 0, o.d/2 + (o.cols?3.2:1.8)).applyAxisAngle(V3(0,1,0), g.rotation.y);
  if(o.key) PLACES[o.key] = V3(o.x+out.x, 0, o.z+out.z);
  if(o.label){ const s = labelSprite(o.label, o.labelBg, o.labelFg); s.position.set(o.x, o.h+2.1, o.z); scene.add(s); }
  return g;
}
function tree(x,z,s=1){
  const g = new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  mesh(new THREE.CylinderGeometry(.22*s,.3*s,1.6*s,6), '#8A6448', 0, .8*s, 0, g);
  const cols = ['#6FCF6A','#58B95E','#93DB6B'];
  mesh(new THREE.IcosahedronGeometry(1.35*s,0), cols[Math.floor(Math.abs(x*7+z*3))%3], 0, 2.4*s, 0, g);
  obstacle(x,z,.7,.7);
}
function lamp(x,z,broken){
  mesh(new THREE.CylinderGeometry(.09,.12,4.6,6), '#3A3D4A', x, 2.3, z);
  const b = mesh(new THREE.SphereGeometry(.32,10,8), broken?'#555866':'#FFF4B8', x, 4.7, z);
  if(!broken){ b.material = new THREE.MeshBasicMaterial({color:'#FFF4B8'}); }
  obstacle(x,z,.3,.3);
}
function bench(x,z,rot=0){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = rot; scene.add(g);
  box(2.4,.15,.7,'#C98B55',0,.55,0,g); box(2.4,.6,.12,'#C98B55',0,.95,-.32,g);
  box(.12,.55,.6,'#3A3D4A',-1,.27,0,g); box(.12,.55,.6,'#3A3D4A',1,.27,0,g);
}

/* ---------- personagens ---------- */
function makeChar(o){
  const g = new THREE.Group(); const u = g.userData;
  const skin = o.pele, cap = (r,l,c)=>new THREE.CapsuleGeometry(r,l,4,10);
  const torso = mesh(cap(.4,.55), o.camisa, 0, 1.22, 0, g);
  torso.scale.z = .72;
  const head = new THREE.Group(); head.position.y = 1.98; g.add(head); u.head = head;
  mesh(new THREE.SphereGeometry(.38,18,14), skin, 0, 0, 0, head);
  mesh(new THREE.SphereGeometry(.05,8,6), '#111216', -.13, .02, .34, head);
  mesh(new THREE.SphereGeometry(.05,8,6), '#111216', .13, .02, .34, head);
  const hc = o.corCabelo;
  const capG = (r,t)=>new THREE.SphereGeometry(r,18,12,0,Math.PI*2,0,Math.PI*t);
  if(o.cabelo==='curto'){ const c = mesh(capG(.4,.5), hc, 0, .02, -.02, head); c.rotation.x = -.25; }
  if(o.cabelo==='afro'){ mesh(new THREE.IcosahedronGeometry(.58,1), hc, 0, .22, -.1, head); }
  if(o.cabelo==='coque'){ const c = mesh(capG(.4,.52), hc, 0, .02, -.02, head); c.rotation.x = -.25; mesh(new THREE.SphereGeometry(.2,12,10), hc, 0, .42, -.22, head); }
  if(o.cabelo==='trancas'){ const c = mesh(capG(.4,.52), hc, 0, .02, -.02, head); c.rotation.x = -.25; [-.26,.26].forEach(x=>mesh(new THREE.CylinderGeometry(.07,.06,.8,6), hc, x, -.42, -.18, head)); }
  if(o.cabelo==='longo'){ const c = mesh(capG(.41,.55), hc, 0, .02, -.02, head); c.rotation.x = -.2; box(.74,.75,.2, hc, 0, -.3, -.24, head); }
  if(o.cabelo==='raspado'){ const c = mesh(capG(.385,.42), hc, 0, .02, -.03, head); c.rotation.x = -.25; }
  if(o.acess==='bone'){ const c = mesh(capG(.41,.48), o.camisa==='#111216'?'#E6FF3B':'#111216', 0, .05, 0, head); c.rotation.x = -.15; box(.5,.05,.38, '#111216', 0, .18, .38, head); }
  if(o.acess==='fone'){ mesh(new THREE.TorusGeometry(.43,.05,6,18,Math.PI), '#111216', 0, .05, -.02, head); [-.42,.42].forEach(x=>mesh(new THREE.CylinderGeometry(.13,.13,.12,12).rotateZ(Math.PI/2), '#E6FF3B', x, 0, 0, head)); }
  if(o.acess==='oculos'){ [-.14,.14].forEach(x=>mesh(new THREE.TorusGeometry(.1,.025,6,14), '#111216', x, .03, .37, head)); }
  if(o.acess==='mochila'){ box(.62,.72,.3, '#E6FF3B', 0, 1.25, -.4, g); }
  const limb = (x, y, len, r, color, parent) => { const p = new THREE.Group(); p.position.set(x,y,0); parent.add(p); mesh(cap(r,len), color, 0, -len/2-r*.4, 0, p); return p; };
  u.armL = limb(-.52, 1.5, .5, .12, skin, g);
  u.armR = limb(.52, 1.5, .5, .12, skin, g);
  [u.armL,u.armR].forEach(a=>{ const s = mesh(new THREE.SphereGeometry(.17,10,8), o.camisa, 0, -.04, 0, a); s.scale.y=.9; });
  u.legL = limb(-.2, .82, .45, .15, o.calca, g);
  u.legR = limb(.2, .82, .45, .15, o.calca, g);
  [u.legL,u.legR].forEach(l=>box(.28,.16,.42,'#F4F5F0',0,-.76,.06,l));
  u.phase = 0;
  return g;
}
function animChar(ch, moving, dt){
  const u = ch.userData;
  u.phase += dt * (moving ? 11 : 2.2);
  const s = moving ? Math.sin(u.phase) * .75 : 0;
  u.legL.rotation.x = s; u.legR.rotation.x = -s;
  u.armL.rotation.x = -s*.8; u.armR.rotation.x = s*.8;
  ch.children[0].position.y = 1.22 + (moving ? Math.abs(Math.cos(u.phase))*.06 : Math.sin(u.phase)*.02);
}

function openDlg(){ ui.lock++; clearTimeout(hideTimer); dlg.hidden = false; }
function closeDlg(){ ui.lock = Math.max(0, ui.lock-1); hideTimer = setTimeout(()=>{ if(!dlg.dataset.busy) dlg.hidden = true; }, 60); }
function lookAtPlayer(id){ const n = NPCS[id]; if(!n) return; n.rotation.y = Math.atan2(player.position.x-n.position.x, player.position.z-n.position.z); player.rotation.y = Math.atan2(n.position.x-player.position.x, n.position.z-player.position.z); }

function say(name, text){
  return new Promise(res=>{
    openDlg(); dlg.dataset.busy = '1';
    dName.hidden = !name; dName.textContent = name || '';
    dText.className = 'text' + (name ? '' : ' narr');
    dCh.innerHTML = ''; dMore.hidden = true;
    const base = VOICE[name] || (name===N() ? 330 : 0);
    let i = 0, done = false;
    const iv = setInterval(()=>{
      i += 2; dText.textContent = text.slice(0,i);
      if(base && i%4===0) SFX.talk(base);
      if(i >= text.length){ clearInterval(iv); done = true; dMore.hidden = false; }
    }, 24);
    const adv = () => {
      if(!done){ clearInterval(iv); dText.textContent = text; done = true; dMore.hidden = false; return; }
      dlg.onclick = null; ui.keyFn = null; delete dlg.dataset.busy; SFX.click(); closeDlg(); res();
    };
    dlg.onclick = adv;
    ui.keyFn = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); adv(); } };
  });
}
function choose(opts, name, prompt){
  return new Promise(res=>{
    openDlg(); dlg.dataset.busy = '1'; dlg.onclick = null;
    dName.hidden = !name; dName.textContent = name || '';
    dText.className = 'text' + (name ? '' : ' narr');
    dText.textContent = prompt || '';
    dMore.hidden = true;
    dCh.innerHTML = opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="n">${k+1}</span><span>${esc(o)}</span></button>`).join('');
    const pick = k => { dCh.innerHTML = ''; ui.keyFn = null; delete dlg.dataset.busy; SFX.ok(); closeDlg(); xp(5); res(k); };
    dCh.querySelectorAll('.choice').forEach(b=>b.onclick = ev => { ev.stopPropagation(); pick(+b.dataset.k); });
    ui.keyFn = e => { const k = parseInt(e.key,10)-1; if(k>=0 && k<opts.length) pick(k); };
    setTimeout(()=>dCh.querySelector('.choice')?.focus({preventScroll:true}), 50);
  });
}
const ovl = $('#ovl');
function overlay(cls, html){ ovl.innerHTML = `<div class="ovl ${cls}">${html}</div>`; return ovl.firstElementChild; }
function info(kicker, title, body, btn='Continuar'){
  return new Promise(res=>{
    ui.lock++;
    const o = overlay('center', `<div class="card" role="dialog" aria-modal="true"><span class="k">${kicker}</span><h2>${title}</h2>${body}<button class="btn" id="okb">${btn}</button></div>`);
    const b = o.querySelector('#okb'); b.focus({preventScroll:true});
    b.onclick = () => { SFX.click(); ovl.innerHTML=''; ui.lock--; ui.keyFn=null; res(); };
    ui.keyFn = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); } };
  });
}
function chapter(n, title){
  return new Promise(res=>{
    ui.lock++; SFX.chapter();
    const o = overlay('chapter', `<div class="chap"><span class="n">${n ? 'CAPÍTULO '+n : 'DOMINGO'}</span><h1>${title}</h1></div>`);
    let gone = false;
    const end = () => { if(gone) return; gone = true; ovl.innerHTML=''; ui.lock--; ui.keyFn=null; res(); };
    o.onclick = end; ui.keyFn = e => { if(e.key===' '||e.key==='Enter') end(); };
    setTimeout(end, 2600);
  });
}
function toast(html){ const t = document.createElement('div'); t.className='toast'; t.innerHTML = html; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function hud(){ $('#hCap').textContent = st.cap ? `Capítulo ${st.cap} · ${CAPS[st.cap-1]}` : ''; }
function addVoz(n){ st.voz = Math.min(100, st.voz + n); $('#hVoz').style.width = st.voz + '%'; }

/* ---------- objetivos ---------- */
let quest = null;
function goTo(obj, targets){
  return new Promise(res=>{
    quest = {obj, res, targets: targets.map(t=>({...t, pos: t.pos || (t.npc ? npcPos(t.npc) : PLACES[t.at]), done:false}))};
    quest.targets.forEach(t => t.marker = makeMarker(t.pos, t.prop));
    updateObj();
  });
}
function updateObj(){
  if(!quest){ $('#hObj').textContent = ''; return; }
  const n = quest.targets.length, d = quest.targets.filter(t=>t.done).length;
  $('#hObj').textContent = n > 1 ? `${quest.obj} (${d}/${n})` : quest.obj;
}
async function arrive(t){
  ui.lock++;
  scene.remove(t.marker);
  if(t.npc) lookAtPlayer(t.npc);
  ui.lock--;
  if(t.run) await t.run();
  t.done = true; updateObj(); xp(10);
  if(quest && quest.targets.every(x=>x.done)){ const r = quest.res; quest = null; updateObj(); r(); }
}

/* ---------- urna ---------- */
function urna(){
  return new Promise(res=>{
    ui.lock++;
    const u = {etapa:0, d:'', branco:false, fim:false};
    const cargos = [{n:'VEREADOR', d:5},{n:'PREFEITO', d:2}];
    const draw = () => {
      const c = cargos[u.etapa];
      let tela;
      if(u.fim) tela = '<div style="margin:auto;font-size:46px;font-weight:800;letter-spacing:.06em">FIM</div>';
      else {
        const full = u.d.length===c.d;
        tela = `<span>SEU VOTO PARA</span><span class="cargo">${c.n}</span>
          ${u.branco ? '<span style="font-weight:800;font-size:18px;margin:8px 0">VOTO EM BRANCO</span>' : `<div class="digs">${Array.from({length:c.d},(_,k)=>`<span>${u.d[k]||''}</span>`).join('')}</div>`}
          ${full && !u.branco ? '<span><b>Nome:</b> Candidatura de exemplo<br><b>Partido:</b> Fictício</span>' : ''}
          <span class="inst">Aperte a tecla:<br>CONFIRMA para CONFIRMAR<br>CORRIGE para REINICIAR</span>`;
      }
      const o = overlay('center', `<div class="card" role="dialog" aria-modal="true"><span class="k">Cabine de votação</span><h2>Sua vez</h2>
        <p>Digite qualquer número para simular. Nenhum candidato real aparece aqui.</p>
        <div class="urna"><div class="tela" aria-live="polite">${tela}</div>
          <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="z" data-n="0">0</button></div>
          <div class="acoes"><button class="branco" data-a="b">BRANCO</button><button class="corrige" data-a="c">CORRIGE</button><button class="confirma" data-a="ok">CONFIRMA</button></div>
        </div>${u.fim ? '<button class="btn" id="sair">Sair da cabine</button>' : ''}</div>`);
      o.querySelectorAll('.teclado button').forEach(b=>b.onclick=()=>{ if(u.fim||u.branco||u.d.length>=c.d) return; u.d += b.dataset.n; SFX.key(); draw(); });
      o.querySelectorAll('.acoes button').forEach(b=>b.onclick=()=>{
        if(u.fim) return; const a = b.dataset.a; SFX.key();
        if(a==='c'){ u.d=''; u.branco=false; }
        if(a==='b' && !u.d) u.branco = true;
        if(a==='ok'){
          if(!(u.branco || u.d.length===c.d)) return;
          if(u.etapa===0){ u.etapa=1; u.d=''; u.branco=false; SFX.ok(); } else { u.fim=true; SFX.urnaFim(); }
        }
        draw();
      });
      const s = o.querySelector('#sair'); if(s) s.onclick = () => { ovl.innerHTML=''; ui.lock--; res(); };
    };
    draw();
  });
}

function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; }); }
function portrait(){
  const r = new THREE.WebGLRenderer({alpha:true, antialias:true, preserveDrawingBuffer:true});
  r.setSize(640,640,false);
  const sc = new THREE.Scene();

let mode = 'title', last = performance.now(), stepT = 0, t = 0;
const camTarget = V3(0,0,0);

addEventListener('resize', resize);

function frame(nowMs){
  const dt = Math.min(.05, (nowMs-last)/1000); last = nowMs; t += dt;
  CLOUDS.forEach((c,i)=>{ c.position.x += dt*(.6+i*.08); if(c.position.x > 80) c.position.x = -80; });
  Object.values(NPCS).forEach(n=>animChar(n,false,dt));
  updateWorld(dt);

  if(mode==='title'){
    const a = t*.06; camera.position.set(Math.sin(a)*58, 34, Math.cos(a)*58); camera.lookAt(0,0,-4);
  } else if(mode==='custom'){
    player.rotation.y += dt*.7; animChar(player,false,dt);
    camera.position.lerp(V3(player.position.x, 2.6, player.position.z-11), 1-Math.exp(-dt*6)); camera.lookAt(player.position.x, 1.2, player.position.z);
    const sheetH = (document.querySelector('.sheetbox')?.offsetHeight || 0);
    camera.setViewOffset(innerWidth, innerHeight, 0, sheetH*.45, innerWidth, innerHeight);
  } else if(player){
    let mx = 0, mz = 0;
    if(!ui.lock){
      if(keys['a']||keys['arrowleft']) mx -= 1; if(keys['d']||keys['arrowright']) mx += 1;
      if(keys['w']||keys['arrowup']) mz -= 1; if(keys['s']||keys['arrowdown']) mz += 1;
      mx += jv.x; mz += jv.y;
    }
    { const cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw), wx = mx*cy + mz*sy, wz = -mx*sy + mz*cy; mx = wx; mz = wz; }
    const len = Math.hypot(mx,mz), moving = len > .12;
    if(moving){
      const sp = 8.5 * Math.min(1,len) / Math.max(1,len);
      player.position.x += mx*sp*dt; player.position.z += mz*sp*dt;
      const target = Math.atan2(mx, mz); let d = target - player.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * Math.min(1, dt*12);
      stepT -= dt; if(stepT <= 0){ SFX.step(); stepT = .3; }
      const p = player.position, R = .45;
      for(const o of OBS){
        if(p.x>o.minX-R && p.x<o.maxX+R && p.z>o.minZ-R && p.z<o.maxZ+R){
          const dl=p.x-(o.minX-R), dr=(o.maxX+R)-p.x, du=p.z-(o.minZ-R), dd=(o.maxZ+R)-p.z, m=Math.min(dl,dr,du,dd);
          if(m===dl) p.x=o.minX-R; else if(m===dr) p.x=o.maxX+R; else if(m===du) p.z=o.minZ-R; else p.z=o.maxZ+R;
        }
      }
      p.x = Math.max(-60, Math.min(60, p.x)); p.z = Math.max(-58, Math.min(58, p.z));
    }
    animChar(player, moving, dt);
    { let d = CAM.yawT - CAM.yaw; CAM.yaw += d * Math.min(1, dt*8); CAM.zoom += (CAM.zoomT - CAM.zoom) * Math.min(1, dt*6); }
    const k = (camera.aspect < 1 ? 1.4 : 1) * CAM.zoom, hk = Math.pow(CAM.zoom, 1.35) * (camera.aspect < 1 ? 1.4 : 1);
    camTarget.set(player.position.x + Math.sin(CAM.yaw)*10.5*k, 19*hk + 1.5, player.position.z + Math.cos(CAM.yaw)*10.5*k);
    camera.position.lerp(camTarget, 1-Math.exp(-dt*6));
    camera.lookAt(player.position.x - Math.sin(CAM.yaw), 1.2, player.position.z - Math.cos(CAM.yaw));

    // NPCs olham para quem chega perto
    Object.values(NPCS).forEach(n=>{
      if(!n.visible) return;
      const dx = player.position.x-n.position.x, dz = player.position.z-n.position.z;
      const want = (dx*dx+dz*dz < 30) ? Math.atan2(dx,dz) : n.userData.baseRot;
      let d = want - n.rotation.y; d = Math.atan2(Math.sin(d),Math.cos(d)); n.rotation.y += d*Math.min(1,dt*4);
    });

    // objetivos
    guide.visible = false;
    if(quest){
      let best = null, bd = 1e9;
      for(const q of quest.targets){
        if(q.done) continue;
        const m = q.marker; m.userData.gem.rotation.y += dt*2; m.userData.gem.position.y = 3.6 + Math.sin(t*3)*.2;
        const s = 1 + Math.sin(t*4)*.08; m.userData.ring.scale.set(s,1,s);

        const d = Math.hypot(q.pos.x-player.position.x, q.pos.z-player.position.z);
        if(d < bd){ bd = d; best = q; }
        if(!ui.lock && !q.busy && d < q.r){ q.busy = true; arrive(q); }
      }
      if(best && bd > 4.5 && !ui.lock){
        const a = Math.atan2(best.pos.x-player.position.x, best.pos.z-player.position.z);

      }
    }
    checkNear();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const fxc = $('#fxc'), fctx = fxc.getContext('2d'); let parts = [], fxOn = false;
function confetti(x, y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fxc.width = innerWidth; fxc.height = innerHeight;
  const cols = ['#E6FF3B','#FF7AD9','#3AD67A','#2F4BFF','#FF5A1F','#FFC93C'];
  for(let i=0;i<(x?50:110);i++){
    if(x) { const a = Math.random()*Math.PI*2, v = 3+Math.random()*5; parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-3, g:.2, life:60, c:cols[i%6]}); }
    else parts.push({x:Math.random()*innerWidth, y:-20-Math.random()*200, vx:(Math.random()-.5)*3, vy:2+Math.random()*3, g:.05, life:170, c:cols[i%6]});
  }
  if(!fxOn){ fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fctx.clearRect(0,0,fxc.width,fxc.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){ p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; fctx.globalAlpha = Math.min(1,p.life/25); fctx.fillStyle = p.c; fctx.fillRect(p.x, p.y, 7, 7); }
  fctx.globalAlpha = 1;
  parts.length ? requestAnimationFrame(fxLoop) : (fxOn = false);
}

function exCard(kicker, title, inner){

}
function exFeedback(ok, html, onNext){
  const fb = $('#exfb'); fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<b>${ok ? (st.combo >= 3 ? 'Mandou bem! Combo x'+st.combo : 'Mandou bem!') : 'Não foi dessa vez'}</b>${html}`;
  const b = $('#exok'); b.hidden = false; b.disabled = false; b.textContent = 'Continuar'; b.className = 'btn ' + (ok ? 'green' : 'red');

function scoreEx(ok){
  st.checks++;
  if(ok){ st.combo++; st.acertos++; SFX.right(st.combo); xp(10 + (st.combo>=2 ? 5 : 0), st.combo>=2 ? 'combo x'+st.combo : ''); if(st.acertos >= 6) medal('checador'); }

}
const exClose = res => v => { SFX.click(); ovl.innerHTML = ''; ui.lock--; ui.keyFn = null; res(v); };
function exChoice({kicker, title, stmt, ops, correct, exp, blank}){
  return new Promise(res=>{
    ui.lock++; let sel = null; const close = exClose(res);
    const o = exCard(kicker, title, `<div class="stmt">${stmt}</div><div class="tiles ${ops.length===2?'c2':'c3'}">${ops.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')}</div>`);
    const tiles = [...o.querySelectorAll('.tile')], ok = o.querySelector('#exok');
    tiles.forEach(b=>b.onclick = () => { if(ok.dataset.done) return; sel = +b.dataset.i; SFX.click(); tiles.forEach(x=>x.classList.toggle('sel', x===b)); if(blank) o.querySelector('.blank').textContent = ops[sel]; ok.disabled = false; });
    ui.keyFn = e => { const k = parseInt(e.key,10)-1; if(k>=0 && k<tiles.length) tiles[k].click(); if(e.key==='Enter' && sel!==null) ok.click(); };
    ok.onclick = () => {
      if(sel===null || ok.dataset.done) return; ok.dataset.done = 1;
      const good = sel === correct;
      tiles.forEach((x,i)=>{ x.disabled = true; if(i===correct) x.classList.add('ok'); else if(i===sel) x.classList.add('no'); });
      scoreEx(good);
      exFeedback(good, `<p>${good ? '' : 'Resposta certa: <b>'+esc(ops[correct])+'</b>. '}${esc(exp)}</p>`, () => close(good));
    };
  });
}

const exLacuna = (quem, pre, pos, ops, correct, exp) => exChoice({kicker:'Complete a frase', stmt:`${quem ? `<span class="who">${esc(quem)}</span>` : ''}${esc(pre)} <span class="blank">&nbsp;</span>${pos==='.' ? '.' : ' '+esc(pos)}`, ops, correct, exp, blank:true});
function exParear(titulo, pairs){
  return new Promise(res=>{
    ui.lock++; const close = exClose(res);
    const R = pairs.map(p=>p[1]).sort(()=>Math.random()-.5); let pick = null, m = 0, erros = 0;
    const o = exCard('Ligue os pares', titulo, `<div class="pairs"><div class="col">${pairs.map(p=>`<button class="tile" data-s="l">${esc(p[0])}</button>`).join('')}</div><div class="col">${R.map(t=>`<button class="tile" data-s="r">${esc(t)}</button>`).join('')}</div></div>`);
    const okb = o.querySelector('#exok'); okb.hidden = true;
    o.querySelectorAll('.pairs .tile').forEach(b=>b.onclick = async () => {
      if(b.classList.contains('done') || okb.dataset.done) return;
      if(!pick || pick.dataset.s === b.dataset.s){ o.querySelectorAll('.pairs .tile').forEach(x=>x.classList.remove('sel')); pick = b; b.classList.add('sel'); SFX.click(); return; }
      const l = pick.dataset.s==='l' ? pick : b, r = pick.dataset.s==='r' ? pick : b; pick = null;
      l.classList.remove('sel'); r.classList.remove('sel');
      const good = pairs.some(p=>p[0]===l.textContent && p[1]===r.textContent);
      if(good){
        SFX.right(m); l.classList.add('ok'); r.classList.add('ok'); m++; await sleep(300); l.classList.add('done'); r.classList.add('done');
        if(m === pairs.length){
          okb.dataset.done = 1; st.checks++; st.acertos++; st.combo = erros ? 0 : st.combo + 1;
          xp(erros ? 10 : 20, erros ? '' : 'sem erros'); if(!erros) medal('pares'); if(st.acertos >= 6) medal('checador');
          exFeedback(true, `<p>${erros ? 'Tudo ligado.' : 'Perfeito, de primeira!'} Cada nível de governo cuida de uma parte. Saber quem decide é o que permite cobrar a pessoa certa.</p>`, () => close(true));
        }
      } else { erros++; SFX.wrong(); l.classList.add('no'); r.classList.add('no'); await sleep(450); l.classList.remove('no'); r.classList.remove('no'); }
    });
  });
}
function exOrdenar(titulo, itens, exp){
  return new Promise(res=>{
    ui.lock++; const close = exClose(res);
    const bank = itens.map((t,i)=>({t,i})).sort(()=>Math.random()-.5), ans = [];
    const o = exCard('Ordene os passos', titulo, `<p class="note">Toque nos passos na ordem certa. Toque de novo para devolver.</p><div class="slots" id="sl"></div><div class="bank" id="bk"></div>`);
    const okb = o.querySelector('#exok');
    const draw = () => {
      const sl = o.querySelector('#sl'), bk = o.querySelector('#bk'); sl.innerHTML = ''; bk.innerHTML = '';
      ans.forEach((it,k)=>{ const b = document.createElement('button'); b.className = 'tile'; b.innerHTML = `<span class="k">${k+1}</span>${esc(it.t)}`; b.onclick = () => { if(okb.dataset.done) return; ans.splice(k,1); bank.push(it); SFX.click(); draw(); }; sl.appendChild(b); });
      bank.forEach((it,k)=>{ const b = document.createElement('button'); b.className = 'tile'; b.textContent = it.t; b.onclick = () => { if(okb.dataset.done) return; bank.splice(k,1); ans.push(it); SFX.ok(); draw(); }; bk.appendChild(b); });
      okb.disabled = bank.length > 0;
    };
    draw();
    okb.onclick = () => {
      if(bank.length || okb.dataset.done) return; okb.dataset.done = 1;

      o.querySelectorAll('#sl .tile').forEach((b,k)=>{ b.disabled = true; b.classList.add(ans[k].i===k ? 'ok' : 'no'); });

  });
}

function updateWorld(dt){
  const P = player ? player.position : null;
  MEGA_MESH.forEach((m,i)=>{ if(!m.visible) return; m.rotation.y += dt*1.8; m.position.y = 1.3 + Math.sin(t*2.4 + i)*.18; });
  CARS.forEach(c=>{
    let block = false;
    if(P){
      const along = c.axis==='x' ? (P.x - c.pos)*c.dir : (P.z - c.pos)*c.dir;
      const side = c.axis==='x' ? Math.abs(P.z - c.lane) : Math.abs(P.x - c.lane);
      block = along > 0 && along < 6.5 && side < 2.2;
    }
    c.v += ((block ? 0 : c.sp) - c.v) * Math.min(1, dt*4);
    if(block && mode==='play' && c.honk <= 0){ SFX.honk(); c.honk = 5; }
    c.honk -= dt;
    c.pos += c.dir * c.v * dt;
    if(c.axis==='x'){ if(c.pos > 66) c.pos = -66; if(c.pos < -66) c.pos = 66; c.g.position.set(c.pos, 0, c.lane); }
    else { if(c.pos > 60) c.pos = -40; if(c.pos < -40) c.pos = 60; c.g.position.set(c.lane, 0, c.pos); }
  });
  WALKERS.forEach(w=>{
    const wx = w.axis==='x' ? w.pos : w.line, wz = w.axis==='x' ? w.line : w.pos;
    const near = P && Math.hypot(P.x-wx, P.z-wz) < 1.6;
    if(!near){ w.pos += w.dir * w.sp * dt; if(w.pos > w.b){ w.pos = w.b; w.dir = -1; } if(w.pos < w.a){ w.pos = w.a; w.dir = 1; } }
    w.g.position.set(w.axis==='x' ? w.pos : w.line, 0, w.axis==='x' ? w.line : w.pos);
    w.g.rotation.y = w.axis==='x' ? (w.dir>0 ? Math.PI/2 : -Math.PI/2) : (w.dir>0 ? 0 : Math.PI);
    animChar(w.g, !near, dt);
  });
  if(mode==='play'){ birdT -= dt; if(birdT <= 0){ SFX.bird(); birdT = 8 + Math.random()*12; } }
}

    if(msgT > 0){ msgT -= dt; ctx.font = '9px "Pixelify Sans", sans-serif'; const w = Math.min(300, ctx.measureText(msg).width + 16); ctx.fillStyle = 'rgba(14,18,48,.9)'; ctx.fillRect(160-w/2, 22, w, 15); ctx.fillStyle = msgC; ctx.textAlign = 'center'; ctx.fillText(msg, 160, 33); ctx.textAlign = 'left'; }
    if(flash > 0){ flash -= dt; ctx.fillStyle = 'rgba(255,59,78,.3)'; ctx.fillRect(0,0,320,180); }
    if(life <= 0 || (!queue.length && !live.length)) return finish({score, acertos, total:CORRENTES.length, lst:lst.map(l=>`<p>${esc(l)}</p>`).join('')});
    IN.raf = requestAnimationFrame(f);
  };
  IN.raf = requestAnimationFrame(f);
}

/* minijogo 2: Detector de sites */
function miniSites(finish){
  const ctx = IN.ctx, list = shuffle(SITES.slice()); let i = 0, tl = 7, score = 0, combo = 0, acertos = 0, fb = null, fbT = 0, last = performance.now(), lst = [];
  $('#iu').innerHTML = `<div class="prow"><button class="pbtn g" id="so">◀ Oficial</button><button class="pbtn r" id="sf">Falso ▶</button></div><p class="prule">Dica: sites da Justiça Eleitoral terminam em .jus.br; do Legislativo, em .leg.br; do governo federal, em gov.br.</p>`;
  const why = (u, v) => { const end = u.split('.').pop(); return v ? `termina em ${u.endsWith('gov.br') && !u.endsWith('.jus.br') && !u.endsWith('.leg.br') ? 'gov.br' : u.endsWith('.jus.br') ? '.jus.br' : '.leg.br'}` : `termina em .${end}`; };
  const answer = ans => {
    if(fb || i >= list.length) return;
    const [u, v] = list[i], ok = ans === v;
    if(ok){ combo++; acertos++; score += 10 + Math.round(tl*2) + (combo>=2 ? 5 : 0); SFX.right(combo); fb = {ok:true, t:`${v ? 'OFICIAL' : 'FALSO'}: ${why(u,v)}`}; lst.push(`✓ ${u} (${v ? 'oficial' : 'falso'})`); }
    else { combo = 0; SFX.wrong(); fb = {ok:false, t: ans===null ? `Tempo! Era ${v ? 'oficial' : 'falso'}: ${why(u,v)}` : `Era ${v ? 'oficial' : 'falso'}: ${why(u,v)}`}; lst.push(`✕ ${u}: ${v ? 'oficial' : 'falso'}, ${why(u,v)}`); }
    fbT = 1.5;
  };
  $('#so').onclick = () => answer(true); $('#sf').onclick = () => answer(false);
  addKeys(e => { if(['ArrowLeft','1'].includes(e.key)) answer(true); if(['ArrowRight','2'].includes(e.key)) answer(false); if(e.key==='Escape') exitPlace(); });
  const f = now => {
    if(!IN) return; const dt = Math.min(.05, (now-last)/1000); last = now;
    if(fb){ fbT -= dt; if(fbT <= 0){ fb = null; i++; tl = Math.max(4, 7 - i*.3); } }
    else { tl -= dt; if(tl <= 0) answer(null); }
    drawRoom(ctx, 'biblioteca', now/1000, true);
    ctx.fillStyle = '#2A2D3A'; ctx.fillRect(40,22,240,128); ctx.fillStyle = '#F4F5F0'; ctx.fillRect(48,30,224,104);
    ctx.fillStyle = '#2A2D3A'; ctx.fillRect(140,150,40,10); ctx.fillRect(120,158,80,6);
    ctx.fillStyle = '#DCDEE6'; ctx.fillRect(56,40,208,22); ctx.fillStyle = '#5A5D6B'; ctx.fillRect(62,47,6,8); ctx.fillRect(61,44,8,4);
    if(i < list.length){
      const u = list[i][0]; let fs = 12; ctx.font = `${fs}px "Pixelify Sans", sans-serif`; while(ctx.measureText(u).width > 186 && fs > 7){ fs--; ctx.font = `${fs}px "Pixelify Sans", sans-serif`; }
      ctx.fillStyle = '#111216'; ctx.textAlign = 'left'; ctx.fillText(u, 74, 55);
      ctx.fillStyle = '#DCDEE6'; ctx.fillRect(56,70,208,6); ctx.fillStyle = tl > 2 ? '#2F4BFF' : '#FF3B4E'; if(!fb) ctx.fillRect(56,70,208*Math.max(0,tl)/Math.max(4, 7 - i*.3),6);
      ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#5A5D6B'; ctx.fillText(`SITE ${i+1} DE ${list.length}`, 160, 96);
      if(fb){ ctx.fillStyle = fb.ok ? '#3AD67A' : '#FF3B4E'; ctx.fillRect(56,104,208,24); ctx.fillStyle = fb.ok ? '#111216' : '#fff'; ctx.font = '9px "Pixelify Sans", sans-serif'; ctx.fillText(fb.t, 160, 120); }
      ctx.textAlign = 'left';
    }
    hudTxt(ctx, `${score} PTS${combo>=2 ? ' x'+combo : ''}`);
    if(i >= list.length) return finish({score, acertos, total:list.length, lst:lst.map(l=>`<p>${esc(l)}</p>`).join('')});
    IN.raf = requestAnimationFrame(f);
  };
  IN.raf = requestAnimationFrame(f);
}

/* minijogo 3: Esteira de pedidos */
function miniEsteira(finish){
  const ctx = IN.ctx, list = shuffle(PEDIDOS.slice()); let i = 0, x = -130, life = 3, score = 0, combo = 0, acertos = 0, fly = null, msg = 'Mande cada pedido para quem decide', msgC = '#E6FF3B', msgT = 2.5, flash = 0, belt = 0, last = performance.now(), lst = [], counts = [0,0,0];
  $('#iu').innerHTML = `<div class="prow"><button class="pbtn o" data-n="0">1 · Município</button><button class="pbtn b" data-n="1">2 · Estado</button><button class="pbtn g" data-n="2">3 · União</button></div>`;
  const next = () => { i++; x = -130; };
  const answer = n => {
    if(fly || i >= list.length) return;
    const [txt, ans] = list[i];
    if(n === ans){ combo++; acertos++; counts[n]++; score += 10 + (combo>=2 ? 5 : 0); SFX.right(combo); fly = {n, x, y:126, t:0}; msg = combo>=2 ? `Certo! Combo x${combo}` : `Certo: ${NIVEL[ans]}`; msgC = '#3AD67A'; lst.push(`✓ ${txt}: ${NIVEL[ans]}`); }
    else { life--; combo = 0; flash = .25; SFX.wrong(); msg = `${txt} é com ${ans===2 ? 'a' : 'o'} ${NIVEL[ans]}`; msgC = '#FF8E9C'; lst.push(`✕ ${txt}: é ${NIVEL[ans]}`); next(); }
    msgT = 2.2;
  };
  $('#iu').querySelectorAll('[data-n]').forEach(b=>b.onclick = () => answer(+b.dataset.n));
  addKeys(e => { const n = parseInt(e.key,10)-1; if(n>=0 && n<3) answer(n); if(e.key==='Escape') exitPlace(); });
  const BX = [40,130,220], BC = ['#FF5A1F','#2F4BFF','#3AD67A'];
  const f = now => {
    if(!IN) return; const dt = Math.min(.05, (now-last)/1000); last = now;
    belt = (belt + dt*40) % 16;
    if(fly){ fly.t += dt; if(fly.t > .45){ fly = null; next(); } }
    else if(i < list.length){ x += (34 + i*3)*dt; if(x > 300){ const [txt, ans] = list[i]; life--; combo = 0; flash = .25; SFX.wrong(); msg = `Passou do prazo! Era ${NIVEL[ans]}`; msgC = '#FFC93C'; msgT = 2.2; lst.push(`… ${txt}: era ${NIVEL[ans]}`); next(); } }
    drawRoom(ctx, 'camara', now/1000, true);
    BX.forEach((bx,k)=>{ ctx.fillStyle = BC[k]; ctx.fillRect(bx, 40, 70, 30); ctx.fillStyle = '#111216'; ctx.fillRect(bx, 70, 70, 3); ctx.fillStyle = '#fff'; ctx.font = '7px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.fillText(NIVEL[k].toUpperCase(), bx+35, 54); ctx.fillText(String(counts[k]), bx+35, 65); });
    ctx.fillStyle = '#2A2D3A'; ctx.fillRect(0,138,320,18); ctx.fillStyle = '#4A4D5A'; for(let s=-16;s<320;s+=16) ctx.fillRect(s+belt, 140, 8, 14);
    ctx.fillStyle = '#FF3B4E'; ctx.fillRect(300,118,4,38);
    const drawItem = (ix, iy, txt) => { ctx.font = '9px "Pixelify Sans", sans-serif'; const w = Math.max(90, ctx.measureText(txt).width + 16); ctx.fillStyle = '#C98B55'; ctx.fillRect(ix, iy, w, 20); ctx.fillStyle = '#111216'; ctx.fillRect(ix, iy+20, w, 2); ctx.fillStyle = '#111216'; ctx.textAlign = 'left'; ctx.fillText(txt, ix+8, iy+14); };
    if(fly){ const k = fly.t/.45, tx = BX[fly.n] + 10, ty = 44; drawItem(fly.x + (tx-fly.x)*k, fly.y + (ty-fly.y)*k - Math.sin(k*Math.PI)*30, list[i][0]); }
    else if(i < list.length) drawItem(x, 118, list[i][0]);
    hearts(ctx, life); hudTxt(ctx, `${score} PTS`);
    if(msgT > 0){ msgT -= dt; ctx.font = '9px "Pixelify Sans", sans-serif'; const w = Math.min(300, ctx.measureText(msg).width + 16); ctx.fillStyle = 'rgba(14,18,48,.9)'; ctx.fillRect(160-w/2, 84, w, 15); ctx.fillStyle = msgC; ctx.textAlign = 'center'; ctx.fillText(msg, 160, 95); ctx.textAlign = 'left'; }
    if(flash > 0){ flash -= dt; ctx.fillStyle = 'rgba(255,59,78,.3)'; ctx.fillRect(0,0,320,180); }
    if(life <= 0 || i >= list.length) return finish({score, acertos, total:list.length, lst:lst.map(l=>`<p>${esc(l)}</p>`).join('')});
    IN.raf = requestAnimationFrame(f);
  };
  IN.raf = requestAnimationFrame(f);
}
function addDoorSigns(){
  ['mercadinho','biblioteca','camara'].forEach(k=>{ const p = PLACES[k]; if(!p) return; const s = labelSprite('ENTRAR', '#E6FF3B', '#111216', .7); s.position.set(p.x, 3.4, p.z); scene.add(s); });
}

/* mapa da cidade */
function mapSVG(sel){
  let s = `<svg class="mapsvg" viewBox="-64 -64 128 128" role="img" aria-label="Mapa do bairro">`;
  s += `<rect x="-62" y="-4" width="124" height="8" fill="#4A4D5A"/><rect x="-4" y="-38" width="8" height="100" fill="#4A4D5A"/>`;
  s += `<circle cx="-20" cy="-20" r="11" fill="#E9E6DA"/><rect x="12.5" y="14.5" width="15" height="9" fill="#FF8A4C"/>`;
  MAPB.forEach(b=>{ s += `<rect x="${b.x-b.w/2}" y="${b.z-b.d/2}" width="${b.w}" height="${b.d}" rx="1" fill="${b.c}" stroke="#111216" stroke-width=".5"/>`; });
  if(quest) quest.targets.filter(q=>!q.done).forEach(q=>{ s += `<path d="M${q.pos.x} ${q.pos.z-4}l3.4 4-3.4 4-3.4-4z" fill="#E6FF3B" stroke="#111216" stroke-width=".7"/>`; });
  PLACE_KEYS.forEach((k,i)=>{
    const p = placePos(k); if(!p) return; const v = st.visited.includes(k), on = sel===k;
    s += `<g class="pin" data-k="${k}"><circle cx="${p.x}" cy="${p.z}" r="${on?4.6:3.7}" fill="${on?'#E6FF3B':v?'#2F4BFF':'#FFFFFF'}" stroke="#111216" stroke-width=".8"/><text x="${p.x}" y="${p.z+1.6}" text-anchor="middle" font-size="4.6" font-weight="800" font-family="Outfit,sans-serif" fill="${!on && v ? '#FFFFFF' : '#111216'}">${i+1}</text></g>`;
  });
  s += `<circle cx="${player.position.x}" cy="${player.position.z}" r="2.8" fill="#FF5A1F" stroke="#FFFFFF" stroke-width="1.2"/>`;
  return s + `</svg>`;
}
function mapScreen(sel){
  if(mode!=='play' || ui.lock) return;
  ui.lock++; SFX.click();
  const draw = k => {
    const o = overlay('center', `<div class="card" role="dialog" aria-modal="true" aria-label="Mapa da cidade"><span class="k">Mapa do bairro</span>${mapSVG(k)}
      <div class="placeinfo" aria-live="polite">${k ? `<em>${st.visited.includes(k) ? 'Já visitado' : 'Ainda não visitado'}</em><b>${PLACE_INFO[k].n}</b>${PLACE_INFO[k].d}` : 'Toque num número para ver o que cada lugar significa. O ponto laranja é você; o losango amarelo é o objetivo.'}</div>
      <div class="chips">${PLACE_KEYS.map((p,i)=>`<button data-k="${p}" class="${st.visited.includes(p)?'v':''}" aria-pressed="${p===k}">${i+1}. ${PLACE_INFO[p].n}</button>`).join('')}</div>
      <p class="note">${st.visited.length} de ${PLACE_KEYS.length} lugares descobertos. Ande pelo bairro para descobrir os outros.</p>
      <button class="btn" id="mclose">Fechar mapa</button></div>`);
    o.querySelectorAll('[data-k]').forEach(b=>b.onclick = () => { SFX.click(); draw(b.dataset.k); });
    o.querySelector('#mclose').onclick = () => { SFX.click(); ovl.innerHTML = ''; ui.lock--; ui.keyFn = null; };
    ui.keyFn = e => { if(e.key==='Escape' || e.key==='m') o.querySelector('#mclose').click(); };
  };
  draw(sel || null);
}
function journeyScreen(){
  if(mode!=='play' || ui.lock) return;
  ui.lock++; SFX.click();
  const o = overlay('center', `<div class="card" role="dialog" aria-modal="true" aria-label="Sua jornada"><span class="k">Sua jornada</span><h2>Nível ${LVL(st.xp)}</h2>
    <div class="lvl" style="margin:0"><span>${st.xp % 100}/100 XP</span><b><i style="width:${st.xp % 100}%"></i></b><em>${st.xp} XP no total</em></div>
    <ul class="journey">${CAPS.map((c,i)=>{ const n = i+1, cls = n < st.cap ? 'done' : n===st.cap ? 'cur' : ''; return `<li class="${cls}"><span class="dot">${n < st.cap ? '✓' : n}</span><span>${c}${n===st.cap ? ' · agora' : ''}</span></li>`; }).join('')}</ul>
    <span class="k">Medalhas ${st.medals.length}/${MEDALS.length}</span>
    <div class="medals">${MEDALS.map(m=>`<div class="${st.medals.includes(m.k)?'':'off'}" title="${m.d}">${MEDAL_SVG}<span>${m.n}</span></div>`).join('')}</div>
    <p class="note">Megafones: ${st.megas.length}/${MEGAS.length} · Lugares: ${st.visited.length}/${PLACE_KEYS.length} · Moradores: ${st.talked.length}/${SIDE.length} · Missões extras: ${Object.keys(st.side).length}/3 · Ofensiva: ${streakGet()} ${streakGet()===1?'dia':'dias'}</p>
    <button class="btn" id="jclose">Fechar</button></div>`);
  o.querySelector('#jclose').onclick = () => { SFX.click(); ovl.innerHTML = ''; ui.lock--; ui.keyFn = null; };
  ui.keyFn = e => { if(e.key==='Escape') o.querySelector('#jclose').click(); };
}

/* =========================================================
   TELAS: título e criação de personagem
   ========================================================= */
function titleScreen(){
  mode = 'title';
  const o = overlay('title', `<div class="titlebox">
    <a class="kick" href="../../" style="text-decoration:none">MIDIANDO JOGOS</a>
    <h1>Antes do<br><span class="lime">Título</span></h1>
    <p>Uma aventura sobre descobrir que a sua voz tem peso. Cinco capítulos, uns 12 minutos. O jogo não diz em quem votar.</p>
    ${SAVED && SAVED.cap && !SAVED.fim ? `<button class="btn limeb" id="cont">Continuar · Capítulo ${SAVED.cap}</button><button class="btn ghost" id="play" style="color:#fff">Começar do zero</button>` : `<button class="btn limeb" id="play">Jogar</button>`}
    <p class="note">Melhor com som ligado. No celular, use o joystick; no computador, WASD ou setas. Toque no mapa para descobrir o bairro.</p>
  </div>`);
  o.querySelector('#play').onclick = () => { audioInit(); SFX.click(); if(SAVED){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} } customScreen(); };
  const cont = o.querySelector('#cont');
  if(cont) cont.onclick = () => { audioInit(); SFX.click(); st = Object.assign(st0(), SAVED); applySave(); ovl.innerHTML = ''; startGame(st.cap); };
}
function customScreen(wardrobe){
  mode = 'custom';
  if(wardrobe) ui.lock++;
  buildPlayer();
  camera.position.set(player.position.x, 2.6, player.position.z-11);
  const sw = (key, list) => list.map(c=>{ const L = isLocked(key,c); return `<button data-o="${key}" data-v="${c}" ${L?'data-lock="1"':''} style="background:${c}${L?';opacity:.25':''}" aria-label="${L?'Bloqueado: ':''}${c}" aria-pressed="${st.skin[key]===c}"></button>`; }).join('');
  const tx = (key, list) => list.map(([v,l])=>{ const L = isLocked(key,v); return `<button data-o="${key}" data-v="${v}" ${L?'data-lock="1" style="opacity:.45"':''} aria-pressed="${st.skin[key]===v}">${l}${L?' (baú)':''}</button>`; }).join('');
  const o = overlay('sheet', `<div class="sheetbox" role="dialog" aria-label="Criar personagem">
    <h2>${wardrobe ? 'Seu visual' : 'Crie seu personagem'}</h2>
    ${wardrobe ? `<p class="note">Itens com cadeado saem nos baús do fim de cada capítulo. Você já liberou ${st.itens.length} de ${LOCKED.length}.</p>` : `<div class="field"><label for="nome">Nome</label><input id="nome" maxlength="16" autocomplete="off" placeholder="Ari" value="${esc(st.nome)}"></div>`}
    <div class="opt"><span class="lab">Pele</span><div class="sw">${sw('pele',OPT.pele)}</div></div>
    <div class="opt"><span class="lab">Cabelo</span><div class="tx">${tx('cabelo',OPT.cabelo)}</div><div class="sw">${sw('corCabelo',OPT.corCabelo)}</div></div>
    <div class="opt"><span class="lab">Camiseta</span><div class="sw">${sw('camisa',OPT.camisa)}</div></div>
    <div class="opt"><span class="lab">Calça</span><div class="sw">${sw('calca',OPT.calca)}</div></div>
    <div class="opt"><span class="lab">Acessório</span><div class="tx">${tx('acess',OPT.acess)}</div></div>
    <button class="btn" id="pronto">${wardrobe ? 'Pronto' : 'Começar a história'}</button>
  </div>`);
  o.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    if(b.dataset.lock){ SFX.no(); toast('Abra os <b>baús</b> dos capítulos para liberar'); return; }
    st.skin[b.dataset.o] = b.dataset.v; SFX.click(); buildPlayer();
    o.querySelectorAll(`[data-o="${b.dataset.o}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
  });
  o.querySelector('#pronto').onclick = () => {
    if(wardrobe){ SFX.ok(); ovl.innerHTML = ''; mode = 'play'; camera.clearViewOffset(); ui.lock--; save(); return; }
    st.nome = (o.querySelector('#nome').value || '').trim().slice(0,16) || 'Ari';
    VOICE[st.nome] = 330;
    SFX.click(); ovl.innerHTML = '';
    startGame(1);
  };
}
function startGame(cap){
  mode = 'play';
  camera.clearViewOffset();
  player.rotation.y = Math.PI;
  $('#hud').hidden = false;
  const coarse = matchMedia('(pointer:coarse)').matches;
  $('#joy').hidden = !coarse; $('#kbd').hidden = coarse; $('#side').hidden = false;
  addVoz(0); hudStats();
  CAPFN[cap]();
}

/* =========================================================
   INÍCIO
   ========================================================= */
async function boot(data){
  try{ await Promise.race([document.fonts.load('64px Anton'), sleep(1500)]); }catch(e){}
  buildWorld(); spawnNPCs(); buildWorld2(); resize();
  $('#bMap').onclick = () => mapScreen();
  $('#bTrilha').onclick = () => journeyScreen();
  $('#bLook').onclick = () => { if(mode!=='play' || ui.lock) return; SFX.click(); customScreen(true); };
  setSound(true);
  $('#snd').onclick = () => { audioInit(); setSound(!AU.on); };
  $('#loading').remove();
  requestAnimationFrame(frame);
  const saved = data && data.st;
  if(saved && saved.cap){
    st = Object.assign(st0(), saved, {rec:saved.rec||[]});
    buildPlayer(); VOICE[st.nome] = 330;
    if(st.eleicao){ scene.background.copy(SKY_ELEICAO); NPCS.homem.visible = true; }
    $('#hVoz').style.width = st.voz + '%';
    applySave(); startGame(st.cap);
  } else titleScreen();
}
window.claude?.hot?.snapshot?.(() => ({st}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
